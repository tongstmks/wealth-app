function opForm(id, op){
  const h = hld(id);
  const others = S.holdings.filter(x=>x.id!==id && (op==='transfer'? true : x.type==='cash'));
  const titles = {update:'Update value',deposit:'Add money',withdraw:'Withdraw',buy:'Buy more',sell:'Sell',transfer:'Move money',setbal:'Correct balance'};
  const needOther = ['buy','sell','transfer'].includes(op);
  const amtLabel = op==='update'?'Total value now (฿)':op==='setbal'?'Actual balance now (฿)':'Amount (฿)';
  sheet(`${titles[op]} · ${esc(h.name)}`, `
    ${op==='update'?`<p class="help">Check the value in your InnovestX / Streaming / bank app and enter it. Current: ${B(h.value,true)}</p>`:''}
    ${op==='deposit'||op==='withdraw'?`<p class="help">New money from outside this app (e.g. from your business account), or money taken out to spend.</p>`:''}
    <label>${amtLabel}</label><input id="amt" class="big-input" inputmode="decimal" placeholder="0">
    ${needOther?`<label>${op==='buy'?'Pay from':op==='sell'?'Money goes to':'Move to'}</label><select id="other">${op!=='transfer'?'<option value="">Outside (not tracked)</option>':''}${others.map(o=>`<option value="${o.id}">${esc(holdingLabel(o))}</option>`).join('')}</select>`:''}
    ${op==='buy'||op==='sell'?`<label>Fees (฿, optional)</label><input id="fee" inputmode="decimal" placeholder="0">`:''}
    <div class="grid2"><div><label>Date</label><input id="dt" type="date" value="${today()}"></div><div><label>Note</label><input id="nt" placeholder="optional"></div></div>
    <div class="actions"><button class="primary" id="ok">Save</button></div>`, el=>{
    el.querySelector('#ok').onclick=()=>{
      const amt=num(val(el,'amt')); if(amt<0 || (amt===0 && op!=='update' && op!=='setbal')) return toast('Enter an amount');
      const date=val(el,'dt')||today(), note=val(el,'nt'), fee=el.querySelector('#fee')?num(val(el,'fee')):0;
      const other = needOther ? hld(val(el,'other')) : null;
      const ratio = (x,a) => x.value>0 ? Math.min(1,a/x.value) : 1;
      const costOut = (x,a) => x.type==='cash' ? a : x.cost*ratio(x,a);
      const mv = (kind, d, f) => put('txns', {date, kind, hid:id, hid2:other?.id, amt, note: note || (fee?`fee ${B(fee,true)}`:''), d, f});
      const cross = other && other.bucketId!==h.bucketId;
      if(op==='update'){ put('txns', {date,kind:'update',hid:id,amt:amt-h.value,note:note||`${B(h.value)} → ${B(amt)}`}); h.base=amt; h.baseCost=h.type==='cash'?amt:h.cost; h.baseAt=Date.now(); }
      else if(op==='setbal'){ put('txns', {date,kind:'update',hid:id,amt:amt-h.value,note:note||'Balance corrected'}); h.base=amt; h.baseCost=amt; h.baseAt=Date.now(); }
      else if(op==='deposit'){ mv('deposit', [{h:id,v:amt,c:amt}], [{b:h.bucketId,a:amt}]); }
      else if(op==='withdraw'){ if(amt>h.value+0.01) return toast('More than the holding has'); mv('withdraw', [{h:id,v:-amt,c:-costOut(h,amt)}], [{b:h.bucketId,a:-amt}]); }
      else if(op==='buy'){
        if(other && amt+fee>other.value+0.01) return toast('Not enough cash in that holding');
        const d=[{h:id,v:amt,c:amt+fee}]; if(other) d.push({h:other.id,v:-(amt+fee),c:-(amt+fee)});
        const f = !other ? [{b:h.bucketId,a:amt+fee}] : cross ? [{b:h.bucketId,a:amt+fee},{b:other.bucketId,a:-(amt+fee)}] : [];
        mv('buy', d, f);
      }
      else if(op==='sell'){
        if(amt>h.value+0.01) return toast('More than the holding has');
        const d=[{h:id,v:-amt,c:-costOut(h,amt)}]; if(other) d.push({h:other.id,v:amt-fee,c:amt-fee});
        const f = !other ? [{b:h.bucketId,a:-amt}] : cross ? [{b:h.bucketId,a:-amt},{b:other.bucketId,a:amt-fee}] : [];
        mv('sell', d, f);
      }
      else if(op==='transfer'){
        if(!other) return toast('Choose where to'); if(amt>h.value+0.01) return toast('More than the holding has');
        mv('transfer', [{h:id,v:-amt,c:-costOut(h,amt)},{h:other.id,v:amt,c:amt}], cross ? [{b:h.bucketId,a:-amt},{b:other.bucketId,a:amt}] : []);
      }
      h.updated=date; put('holdings', h); if(other){ other.updated=date; put('holdings', other); }
      after(); toast('Saved');
    };
  });
}
function bulkUpdate(){

  sheet('Monthly check-in', `<p class="help">Open your InnovestX, Streaming and bank apps and type in today's values. Only changed numbers are saved.</p>
    ${groups.map(g=>`<h3>${esc(g.b.name)}</h3>${g.hs.map(h=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span class="dot" style="background:${tColor(h.type)}"></span><div style="flex:1;min-width:0"><div class="title" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name)}</div><div class="faint">${esc(acc(h.accountId)?.name||'')} · ${fmtDate(h.updated||today())}</div></div><input data-bu="${h.id}" inputmode="decimal" value="${Math.round(h.value*100)/100}" style="width:42%;text-align:right"></div>`).join('')}`).join('')}
    <div class="actions"><button class="primary" id="ok">Save changes</button></div>`, el=>{
    el.querySelectorAll('[data-bu]').forEach(i=>i.onfocus=()=>i.select());
    el.querySelector('#ok').onclick=()=>{
      let n=0;
      el.querySelectorAll('[data-bu]').forEach(i=>{ const h=hld(i.dataset.bu); const v=num(i.value); if(Math.abs(v-h.value)>0.004){ put('txns', {date:today(),kind:'update',hid:h.id,amt:v-h.value,note:`${B(h.value)} → ${B(v)}`}); h.base=v; h.baseCost=h.type==='cash'?v:h.cost; h.baseAt=Date.now(); n++; } h.updated=today(); put('holdings', h); });
      after(); toast(n? `${n} value${n>1?'s':''} updated` : 'No changes — marked as checked');
    };
  });
}

function moneyForm(kind){
  const isExp = kind==='exp'; const cash = cashHoldings();
  const list = isExp ? S.settings.categories : S.settings.sources;
  const lastH = isExp ? DEV.lastExpenseHolding : DEV.lastIncomeHolding;
  sheet(isExp?'Record expense':'Record income', `
    <input id="amt" class="big-input" inputmode="decimal" placeholder="฿0">
    <label>${isExp?'Category':'Source'}</label><div class="cat-grid">${list.map((c,i)=>`<button class="chip ${i===0?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label>${isExp?'Paid from':'Paid into'}</label><select id="hid">${cash.map(h=>`<option value="${h.id}" ${h.id===lastH?'selected':''}>${esc(holdingLabel(h))}</option>`).join('')}<option value="" ${!cash.length?'selected':''}>Not a tracked account</option></select>
    <div class="grid2"><div><label>Date</label><input id="dt" type="date" value="${today()}"></div><div><label>Note</label><input id="nt" placeholder="optional"></div></div>
    <div id="bwarn"></div>
    <div class="actions"><button class="primary" id="ok">Save</button></div>`, el=>{
    let cat = list[0];
    el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ el.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cat=b.dataset.cat; });
    const amtIn = el.querySelector('#amt'); setTimeout(()=>amtIn.focus(),80);
    if(isExp) amtIn.oninput = ()=>{ const y=+(val(el,'dt')||today()).slice(0,4); const bs=budgetStatus(y); const a=num(amtIn.value); el.querySelector('#bwarn').innerHTML = bs.budget && bs.spent+a>bs.budget ? `<div class="rec" style="margin-top:10px">⚠ This takes you <b>${B(bs.spent+a-bs.budget)}</b> over your ${y} budget.</div>`:''; };
    el.querySelector('#ok').onclick=()=>{
      const amt=num(amtIn.value); if(amt<=0) return toast('Enter an amount');
      const hid=val(el,'hid')||null, date=val(el,'dt')||today();
      let d=[], f=[];
      if(hid){ const h=hld(hid); const dv = isExp? -amt : amt; d=[{h:hid,v:dv,c:dv}];
        if(isExp || cat!==RETURN_SOURCE) f=[{b:h.bucketId,a:dv}];   // dividends/interest = investment return, not new money
        if(isExp) DEV.lastExpenseHolding=hid; else DEV.lastIncomeHolding=hid; saveDev(); }
      if(isExp) put('expenses', {date,amt,cat,hid,note:val(el,'nt'),d,f});
      else put('income', {date,amt,src:cat,hid,note:val(el,'nt'),d,f});
      after();
      if(isExp){ const bs=budgetStatus(+date.slice(0,4)); toast(bs.budget? `Saved · ${B(Math.max(0,bs.remaining))} left in ${date.slice(0,4)} budget` : 'Saved'); } else toast('Saved');
    };
  });
}
const expenseForm = () => moneyForm('exp');
const incomeForm = () => moneyForm('inc');
function entrySheet(kind, id){

/* ================= Backup ================= */
async function exportData(){
  DEV.lastBackup = today(); saveDev();
  const json = JSON.stringify(S);
  const name = `mywealth-backup-${today()}.json`;
  const file = new File([json], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'My Wealth backup'}); UI.keepScroll=true; render(); toast('Backup shared — save it to Google Drive'); return; }
  }catch(e){ if(e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  UI.keepScroll=true; render(); toast('Backup saved to your Downloads');
}
function importFile(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const d=JSON.parse(r.result); if(!d || !Array.isArray(d.holdings)) throw new Error('Not a My Wealth backup');
      confirmSheet(`Replace everything ${DEV.mode==='cloud'?'on BOTH phones':'on this phone'} with this backup?`,'Restore',()=>{ replaceAll(migrate(d)); go({tab:'home'}); toast('Restored'); });
    }catch(e){ toast('Could not read that file: '+e.message); } };
  r.readAsText(f); ev.target.value='';
}

/* Replace all data (restore / clear). With sync on, the old records are deleted for both phones. */
function replaceAll(newS){
  if(DEV.mode==='cloud'){
    KINDS.forEach(k=>S[k].forEach(r=>{ if(!newS[k].some(x=>x.id===r.id)) DIRTY.set(r.id,{kind:k,del:true}); }));
    S = newS; recompute();
    KINDS.forEach(k=>S[k].forEach(r=>{ r.at=Date.now(); DIRTY.set(r.id,{kind:k,del:false}); }));
    S.settings.at = Date.now(); DIRTY.set('settings',{kind:'settings',del:false});
  } else { S = newS; }
  save();
}

  S = blank();
  const start = new Date(); start.setFullYear(start.getFullYear()-1); const s0=iso(start);
  S.settings.created = s0;

  const gr=Bk({name:'Growth',purpose:'Perpetual capital — never spend the principal',targets:{cash:10,equity:70,bond:10,gold:10},permanent:true});
  const H = n=>{ const h={id:uid(),updated:today(),locked:false,ter:0,...n}; S.holdings.push(h); return h; };
  H({name:'Emergency savings',type:'cash',accountId:kb,bucketId:em.id,value:1200000,cost:1200000});
  const daily = H({name:'Daily spending',type:'cash',accountId:sc,bucketId:em.id,value:310000,cost:310000});

  H({name:'Global equity fund',type:'equity',accountId:ix,bucketId:ed.id,value:1020000,cost:840000,ter:1.2});
  H({name:'Growth cash',type:'cash',accountId:sc,bucketId:gr.id,value:900000,cost:900000});
  H({name:'SET50 index fund',type:'equity',accountId:ix,bucketId:gr.id,value:2600000,cost:2500000,ter:0.4});
  H({name:'US S&P500 fund',type:'equity',accountId:ix,bucketId:gr.id,value:9800000,cost:7900000,ter:0.6});
  H({name:'Thai stocks',type:'equity',accountId:st,bucketId:gr.id,value:1200000,cost:1300000});
  H({name:'RMF bond',type:'bond',accountId:ix,bucketId:gr.id,value:1500000,cost:1440000,locked:true,ter:0.5});
  H({name:'Gold fund',type:'gold',accountId:ix,bucketId:gr.id,value:1350000,cost:1100000,ter:0.9});
  DEV.lastExpenseHolding = daily.id; DEV.lastIncomeHolding = daily.id; saveDev();
  const nowMs = Date.now(); S.holdings.forEach(h=>{ h.base=h.value; h.baseCost=h.cost; h.baseAt=nowMs; h.at=nowMs; });
  S.buckets.forEach(b=>{ b.flow0=Math.round(bucketCost(b.id)); b.at=nowMs; }); recompute();
  const endT = totalValue(); let walk=1; const pts=[];
  for(let i=365;i>=1;i--){ walk *= 1+(Math.sin(i/23)*0.002)+(Math.random()-0.5)*0.008; pts.push(walk); }
  const norm = pts[pts.length-1];
  pts.forEach((p,i)=>{ const d=new Date(); d.setDate(d.getDate()-(365-i)); const ramp = 0.86+0.14*(i+1)/365;
    const snap={id:'snap-'+iso(d),d:iso(d),t:0,f:0,b:{},fb:{}};
    S.buckets.forEach(b=>{ const bv=b.id===em.id? bucketValue(b.id)*(0.92+0.08*(i+1)/365) : bucketValue(b.id)*ramp*(p/norm); snap.b[b.id]=Math.round(bv); snap.fb[b.id]=Math.round(b.flow0*(0.92+0.08*(i+1)/365)); snap.t+=snap.b[b.id]; snap.f+=snap.fb[b.id]; });
    S.snaps.push(snap); });
  // a year of income and expenses
  for(let d=new Date(start); d<=new Date(); d.setDate(d.getDate()+1)){
    const ds=iso(d);
    if(d.getDate()===28) S.income.push({id:uid(),date:ds,amt:Math.round(180000+Math.random()*60000),src:'Business',hid:daily.id,note:'TikTok Shop'});

    [['Food',900,0.95],['Groceries',4500,0.3],['Transport',1500,0.4],['Utilities',9000,0.035],['Kids & school',30000,0.03],['Shopping',4000,0.12],['Health',3000,0.03],['Home',6000,0.04]].forEach(([c,a,p])=>{ if(Math.random()<p) S.expenses.push({id:uid(),date:ds,amt:Math.round(a*(0.6+Math.random()*0.8)),cat:c,hid:daily.id,note:''}); });
    if(d.getDate()===5 && d.getMonth()%4===1) S.expenses.push({id:uid(),date:ds,amt:Math.round(120000+Math.random()*80000),cat:'Travel',hid:daily.id,note:'Family trip'});
  }
  S.settings.budgets[nowYear()] = 3000000;
  S.policies.push({id:uid(),name:'Term life — Tong',type:'Life',insurer:'AIA',insured:'Tong',cover:10000000,premium:28000,renewal:iso(new Date(Date.now()+20*864e5)),beneficiary:'Namthip',policyNo:'',notes:''});

}
