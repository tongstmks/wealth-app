<style>
:root{
  color-scheme: light;
  --bg:#f3f3f1; --surface:#fcfcfb; --surface-2:#ececea; --line:#dedcd6;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7974;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#fff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --t-cash:#2a78d6; --t-equity:#eb6834; --t-bond:#1baf7a; --t-gold:#eda100;
  --t-property:#e87ba4; --t-crypto:#008300; --t-other:#6250d6;
  --cost:#8d8b84;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#262624; --line:#34332f;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#94938a;
    --accent:#3987e5; --accent-soft:#1d2b3d;
    --t-cash:#3987e5; --t-equity:#d95926; --t-bond:#199e70; --t-gold:#c98500;
    --t-property:#d55181; --t-crypto:#0ca30c; --t-other:#9085e9;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;-webkit-tap-highlight-color:transparent}

main{max-width:680px;margin:0 auto;padding:10px 14px 28px}
h1{font-size:22px;margin:8px 0 12px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--text-2);font-weight:600}
p{margin:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card.tap{cursor:pointer}
.muted{color:var(--text-2)} .faint{color:var(--text-3);font-size:13px}

.hero{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}

button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 14px;cursor:pointer;min-height:44px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px}

.guide .gbody ul,.guide .gbody ol{padding-left:20px;margin:6px 0}

@media print{

  main{max-width:none}

<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add"><b>+</b> Add</button>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
/* ================= Constants ================= */
const STORE_KEY = 'mywealth.v1';
const TYPES = [
  {k:'cash', n:'Cash'}, {k:'equity', n:'Equity'}, {k:'bond', n:'Bond / Fixed income'},
  {k:'gold', n:'Gold'}, {k:'property', n:'Property'}, {k:'crypto', n:'Crypto'}, {k:'other', n:'Other'}
];
const TYPE_NAME = Object.fromEntries(TYPES.map(t=>[t.k,t.n]));
const tColor = k => `var(--t-${k})`;
const DEFAULT_CATS = ['Food','Groceries','Transport','Utilities','Kids & school','Health','Shopping','Home','Travel','Gifts & donations','Insurance','Other'];
const DEFAULT_SOURCES = ['Business','Salary','Dividends & interest','Rental','Gift','Other'];
const RETURN_SOURCE = 'Dividends & interest';
const DEFAULT_ASSUME = {cash:1, bond:2, equity:6, gold:3, property:3, crypto:0, other:2};
const POLICY_TYPES = ['Life','Health','Critical illness','Accident','Savings / endowment','Home','Car','Other'];

/* ================= State & storage ================= */
const KINDS = ['accounts','buckets','holdings','txns','expenses','income','policies','snaps'];
const MOVES = ['txns','expenses','income'];         // records that move money (carry deltas)
const DEVICE_KEYS = ['lastBackup','guideLang','lastExpenseHolding','lastIncomeHolding'];
let S = null;                                         // shared data (synced)
let DEV = { mode:'local', guideLang:'en' };           // this phone only (never synced)
let DIRTY = new Map();                                // id -> {kind, del} waiting to sync
let UI = { tab:'home', bucket:null, sub:null, range:'1Y', chartBucket:'all', spendYear:new Date().getFullYear(), moneyView:'exp' };

function blank(){
  return { v:3, accounts:[], buckets:[], holdings:[], txns:[], expenses:[], income:[], policies:[], snaps:[], flowB:{},
    settings:{ id:'settings', budgets:{}, categories:DEFAULT_CATS.slice(), sources:DEFAULT_SOURCES.slice(), assume:{...DEFAULT_ASSUME}, inflation:2,
      created:today(), handover:'' } };
}
/* Tiny IndexedDB key-value store (no 5 MB limit like localStorage) */
const IDB = { db:null,
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('mywealth',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{IDB.db=r.result;res();}; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  get(k){ return new Promise(res=>{ if(!IDB.db) return res(undefined); try{ const t=IDB.db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(undefined); }catch(e){ res(undefined); } }); },
  set(k,v){ return new Promise(res=>{ if(!IDB.db) return res(false); try{ const tx=IDB.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }catch(e){ res(false); } }); },
  del(k){ return new Promise(res=>{ if(!IDB.db) return res(false); try{ const tx=IDB.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }catch(e){ res(false); } }); }
};
async function loadState(){
  let d = null, dev = null, outbox = null;
  try{ await IDB.open(); d = await IDB.get('state'); dev = await IDB.get('dev'); outbox = await IDB.get('outbox'); }catch(e){ console.warn('IndexedDB unavailable', e); }
  if(!d){ try{ const raw = localStorage.getItem(STORE_KEY); if(raw) d = JSON.parse(raw); if(!dev){ const rd = localStorage.getItem(STORE_KEY+'.dev'); if(rd) dev = JSON.parse(rd); } }catch(e){} }
  DEV = Object.assign({ mode:'local', guideLang:'en' }, dev||{});
  ['lastTs','mockFb','mockRest'].forEach(k=>delete DEV[k]);   // leftovers from earlier versions
  if(d && d.settings) DEVICE_KEYS.forEach(k=>{ if(d.settings[k]!=null && DEV[k]==null) DEV[k]=d.settings[k]; });
  S = migrate(d);
  if(Array.isArray(outbox)) outbox.forEach(([id,kind,del])=>DIRTY.set(id,{kind,del}));
  recompute();
}
function migrate(d){
  if(!d) return blank();
  const out = Object.assign(blank(), d);
  out.settings = Object.assign(blank().settings, d.settings||{}, {id:'settings'});
  DEVICE_KEYS.forEach(k=>delete out.settings[k]);
  out.settings.assume = Object.assign({...DEFAULT_ASSUME}, out.settings.assume||{});
  KINDS.forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  const v = d.v||1;
  if(v<3){
    // v1/v2 → v3: balances become "base value + later movements", so two phones can add entries at once
    const now = Date.now(); const flow = d.flowB || {};
    out.buckets.forEach(b=>{
      b.flow0 = flow[b.id]!=null ? flow[b.id] : out.holdings.filter(h=>h.bucketId===b.id).reduce((a,h)=>a+(h.cost||0),0);
      if(b.baseline) b.baseline = { invested:(b.baseline.invested||0)+(b.baseline.flows||0), at:now };
      b.at = b.at||now; });
    out.holdings.forEach(h=>{ h.base=h.value||0; h.baseCost=h.cost||0; h.baseAt=now; h.at=h.at||now; });
    MOVES.forEach(k=>out[k].forEach(m=>{ m.at = m.at || parseD(m.date).getTime(); m.legacy = true; delete m.d; delete m.f; }));
    ['accounts','policies'].forEach(k=>out[k].forEach(r=>r.at=r.at||now));
    out.settings.at = out.settings.at||now;
  }
  out.snaps.forEach(sn=>{ if(!sn.id) sn.id='snap-'+sn.d; });
  delete out.flowB; out.v = 3;
  return out;
}
/* Derive balances: holding value = base value + every movement recorded after the base was set */
function recompute(){
  const hm = {}; S.holdings.forEach(h=>{ h.value = h.base||0; h.cost = h.baseCost||0; hm[h.id]=h; });
  const fb = {}; S.buckets.forEach(b=>fb[b.id]=b.flow0||0);
  MOVES.forEach(k=>S[k].forEach(m=>{
    (m.d||[]).forEach(x=>{ const h=hm[x.h]; if(h && (m.at||0)>(h.baseAt||0)){ h.value+=x.v||0; h.cost+=x.c||0; } });
    (m.f||[]).forEach(x=>{ if(fb[x.b]!=null) fb[x.b]+=x.a||0; });
  }));
  S.holdings.forEach(h=>{ h.value=Math.round(h.value*100)/100; if(h.type==='cash') h.cost=h.value; });
  S.flowB = fb;
}
function investedFlowsSince(b){
  if(!b.baseline) return 0; const at=b.baseline.at||0; let tot=0;
  const ids = new Set(holdingsOf(b.id).filter(h=>h.type!=='cash').map(h=>h.id));
  MOVES.forEach(k=>S[k].forEach(m=>{ if((m.at||0)>at) (m.d||[]).forEach(x=>{ if(ids.has(x.h)) tot+=x.v||0; }); }));
  return tot;
}
/* Every change goes through put()/drop() so it can be synced */
function put(kind, rec){
  rec.at = Date.now();
  if(kind==='settings'){ S.settings = rec; }
  else { if(!rec.id) rec.id = uid(); const arr=S[kind]; const i=arr.findIndex(x=>x.id===rec.id); if(i>=0) arr[i]=rec; else arr.push(rec); }
  if(DEV.mode==='cloud') DIRTY.set(rec.id, {kind, del:false});
  return rec;
}
function drop(kind, id){ S[kind] = S[kind].filter(x=>x.id!==id); if(DEV.mode==='cloud') DIRTY.set(id, {kind, del:true}); }
const putSettings = () => put('settings', S.settings);
function save(){ recompute(); takeSnapshot(); persistLocal(); Sync.push(); }
let _persistT = null;
function persistLocal(){
  clearTimeout(_persistT);
  _persistT = setTimeout(async ()=>{
    const ok = await IDB.set('state', JSON.parse(JSON.stringify(S)));
    await IDB.set('outbox', [...DIRTY.entries()].map(([id,x])=>[id,x.kind,x.del]));
    if(!ok){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast('Could not save on this device: '+e.message); } }
    else { try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
  }, 50);
}
function saveDev(){ IDB.set('dev', {...DEV}).then(ok=>{ if(!ok) try{ localStorage.setItem(STORE_KEY+'.dev', JSON.stringify(DEV)); }catch(e){} }); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function today(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt0 = new Intl.NumberFormat('th-TH',{maximumFractionDigits:0});
const fmt2 = new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const B = (n,dec) => (n<0?'−':'')+'฿'+(dec?fmt2:fmt0).format(Math.abs(n||0));
const pct = (n,d=1) => (isFinite(n)? n.toFixed(d):'0')+'%';
const sgn = n => n>0?'+':'';
function short(n){ const a=Math.abs(n); if(a>=1e6) return (n<0?'−':'')+'฿'+(a/1e6).toFixed(a>=1e7?1:2)+'M'; if(a>=1e3) return (n<0?'−':'')+'฿'+(a/1e3).toFixed(0)+'k'; return B(n); }
const num = v => { const n = parseFloat(String(v??'').replace(/[,฿\s]/g,'')); return isFinite(n)?n:0; };
const sum = arr => arr.reduce((a,b)=>a+(b||0),0);
const fmtDate = s => parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const nowYear = () => new Date().getFullYear();

/* ================= Lookups ================= */
const acc = id => S.accounts.find(a=>a.id===id);
const bkt = id => S.buckets.find(b=>b.id===id);
const hld = id => S.holdings.find(h=>h.id===id);
const holdingsOf = bid => S.holdings.filter(h=>h.bucketId===bid);
const bucketValue = bid => sum(holdingsOf(bid).map(h=>h.value));
const bucketCost = bid => sum(holdingsOf(bid).map(h=>h.cost));
const totalValue = () => sum(S.holdings.map(h=>h.value));
const flowOf = bid => bid==='all' ? sum(S.buckets.map(b=>S.flowB[b.id]||0)) : (S.flowB[bid]||0);
const cashHoldings = () => S.holdings.filter(h=>h.type==='cash');
function holdingLabel(h){ const a=acc(h.accountId), b=bkt(h.bucketId); return `${h.name}${a?' · '+a.name:''}${b?' ('+b.name+')':''}`; }
function byType(bid){ const out={}; TYPES.forEach(t=>out[t.k]=0); holdingsOf(bid).forEach(h=>out[h.type]=(out[h.type]||0)+h.value); return out; }

function takeSnapshot(){
  if(!S.holdings.length && !S.snaps.length) return;
  const d = today();
  const snap = { id:'snap-'+d, d, t: Math.round(totalValue()), f: Math.round(flowOf('all')), b:{}, fb:{} };
  S.buckets.forEach(b=>{ snap.b[b.id]=Math.round(bucketValue(b.id)); snap.fb[b.id]=Math.round(flowOf(b.id)); });
  const old = S.snaps.find(x=>x.d===d);
  if(old && old.t===snap.t && old.f===snap.f && JSON.stringify(old.b)===JSON.stringify(snap.b) && JSON.stringify(old.fb)===JSON.stringify(snap.fb)) return;
  put('snaps', snap); S.snaps.sort((a,b)=>a.d<b.d?-1:1);
}

/* ================= Returns, fees, assumptions ================= */
function bucketMix(b){ // % weights per type: target if set, else current
  const tsum = sum(Object.values(b.targets||{}));
  if(tsum===100) return b.targets;
  const v = bucketValue(b.id), bt = byType(b.id), out={};
  if(v>0) TYPES.forEach(t=>{ if(bt[t.k]) out[t.k]=bt[t.k]/v*100; });
  return out;
}
const mixReturn = mix => sum(Object.entries(mix).map(([k,w])=>w/100*(S.settings.assume[k]??0)));
function feePct(holdings){ const v=sum(holdings.map(h=>h.value)); return v>0? sum(holdings.map(h=>h.value*(h.ter||0)))/v : 0; }
function bucketExpected(b){ // nominal % per year after fees
  const gross = mixReturn(bucketMix(b)), fee = feePct(holdingsOf(b.id));
  return { gross, fee, net: gross-fee };
}
function currentExpected(bid){ // based on CURRENT mix — for comparing with actual
  const hs = bid==='all'? S.holdings : holdingsOf(bid); const v=sum(hs.map(h=>h.value)); if(v<=0) return 0;
  return sum(hs.map(h=>h.value*(S.settings.assume[h.type]??0)))/v - feePct(hs);
}

/* Actual performance (Modified Dietz, last 12 months or since start) */
function performance(bid){
  const cut = new Date(); cut.setDate(cut.getDate()-365); const c=iso(cut);
  const start = S.snaps.find(s=>s.d>=c && (bid==='all' ? s.t>0 : (s.b?.[bid]||0)>0));
  if(!start) return null;
  const days = daysBetween(start.d, today()); if(days<30) return { days, tooShort:true };
  const V0 = bid==='all'? start.t : (start.b?.[bid]||0);
  const F0 = bid==='all'? (start.f ?? start.c ?? 0) : (start.fb?.[bid] ?? start.bc?.[bid] ?? 0);
  const V1 = bid==='all'? totalValue() : bucketValue(bid), F1 = flowOf(bid);
  const net = F1-F0, denom = V0 + 0.5*net; if(denom<=0) return null;
  const R = (V1-V0-net)/denom;
  const annual = days>=360 ? R : Math.pow(1+R, 365/days)-1;
  return { days, R:R*100, annual:annual*100, gain:V1-V0-net, since:start.d };
}

/* ================= Rebalancing ================= */
function analyse(b){
  const val = bucketValue(b.id), bt = byType(b.id);
  const targets = b.targets||{}; const tsum = sum(Object.values(targets));
  const rows = TYPES.filter(t=>(targets[t.k]||0)>0 || bt[t.k]>0).map(t=>{
    const cur = val? bt[t.k]/val*100 : 0, tgt = targets[t.k]||0;
    return { k:t.k, value:bt[t.k], cur, tgt, drift:cur-tgt, diff: val*tgt/100 - bt[t.k] };
  });
  const threshold = b.threshold ?? 5;
  const drifted = val>0 && tsum===100 ? rows.filter(r=>Math.abs(r.drift)>threshold) : [];
  const reasons = [];
  if(drifted.length) reasons.push({lvl:'serious', text:`Off target by more than ${threshold} points: `+drifted.map(r=>`${TYPE_NAME[r.k]} ${r.cur.toFixed(1)}% (target ${r.tgt}%)`).join(', ')});
  const months = b.reviewMonths ?? 6;
  const last = parseD(b.lastReview || b.created || today());
  const due = new Date(last); due.setMonth(due.getMonth()+months);
  if(val>0 && new Date()>=due) reasons.push({lvl:'warn', text:`Scheduled review due (every ${months} months; last ${b.lastReview?fmtDate(b.lastReview):'never'})`});
  if(b.baseline && b.baseline.invested>0){
    const ch = (val - bt.cash - b.baseline.invested - investedFlowsSince(b)) / b.baseline.invested * 100;
    if(Math.abs(ch) >= (b.moveTrigger ?? 10)) reasons.push({lvl:'serious', text:`Big market move: invested part ${ch>0?'up':'down'} ${Math.abs(ch).toFixed(1)}% since last review`});
  }
  if(Object.values(targets).filter(v=>v>0).length<=1 && rows.length<=1) reasons.length = 0;
  return { val, rows, tsum, reasons, needs: reasons.length>0 && tsum===100 && val>0, due };
}
function rebalancePlan(b){
  const a = analyse(b); const sells=[], buys=[], lockedNote=[];
  a.rows.forEach(r=>{ if(r.diff < -1) sells.push({...r, amt:-r.diff}); else if(r.diff>1) buys.push({...r, amt:r.diff}); });
  sells.forEach(s=>{
    const free = holdingsOf(b.id).filter(h=>h.type===s.k && !h.locked);
    const freeV = sum(free.map(h=>h.value));
    if(freeV < s.amt) lockedNote.push(`${TYPE_NAME[s.k]}: only ${B(freeV)} can be sold (the rest is locked).`);
    s.amt = Math.min(s.amt, freeV); s.h = free.sort((x,y)=>y.value-x.value)[0];
  });
  buys.forEach(x=>x.h = holdingsOf(b.id).filter(h=>h.type===x.k).sort((p,q)=>q.value-p.value)[0]);
  return { a, sells, buys, lockedNote };
}
function contributionSplit(b, C){
  const a = analyse(b); const T = a.val + C;
  const needs = a.rows.map(r=>({k:r.k, need: Math.max(0, T*r.tgt/100 - r.value)}));
  const totalNeed = sum(needs.map(n=>n.need));
  if(totalNeed<=0) return a.rows.filter(r=>r.tgt>0).map(r=>({k:r.k, amt:C*r.tgt/100}));
  const scale = Math.min(1, C/totalNeed);
  const out = needs.filter(n=>n.need>0).map(n=>({k:n.k, amt:n.need*scale}));
  const left = C - sum(out.map(o=>o.amt));
  if(left>1) a.rows.filter(r=>r.tgt>0).forEach(r=>{ const o=out.find(x=>x.k===r.k); const add=left*r.tgt/100; if(o) o.amt+=add; else out.push({k:r.k, amt:add}); });
  return out;
}

/* ================= Goals & projections ================= */
function goalProjection(b){
  const g = b.goal; if(!g || !g.kind) return null;
  const r = bucketExpected(b).net/100, infl = (g.growth ?? S.settings.inflation)/100;
  const Y0 = nowYear(); const V = bucketValue(b.id);
  const cAmt = num(g.contrib?.amt), cUntil = num(g.contrib?.until)||0;
  const contribIn = y => (cAmt>0 && y<=cUntil) ? cAmt : 0;
  let lastYear, withdrawIn;
  if(g.kind==='withdrawals'){
    const rows = (g.rows||[]).filter(x=>num(x.amt)>0 && num(x.from)>0);
    if(!rows.length) return null;
    lastYear = Math.max(...rows.map(x=>num(x.to)||num(x.from)));
    withdrawIn = y => sum(rows.filter(x=>y>=num(x.from) && y<=(num(x.to)||num(x.from))).map(x=>num(x.amt))) * Math.pow(1+infl, y-Y0);
  } else {
    if(!(num(g.target?.amt)>0 && num(g.target?.year)>=Y0)) return null;
    lastYear = num(g.target.year); withdrawIn = ()=>0;
  }
  const years = []; let bal = V, runsOut = null;
  for(let y=Y0; y<=lastYear; y++){
    const start = bal, c = contribIn(y), w = withdrawIn(y);
    bal = start*(1+r) + c - w;
    if(bal<0 && runsOut===null) runsOut = y;
    years.push({y, start, c, w, end:bal});
  }
  let funded, need, extra = 0;
  const disc = t => Math.pow(1+r, t);
  if(g.kind==='withdrawals'){
    const pvW = sum(years.map((x,i)=>x.w/disc(i+1))), pvC = sum(years.map((x,i)=>x.c/disc(i+1)));
    need = pvW; funded = pvW-pvC>0 ? V/(pvW-pvC)*100 : 999;
    const shortfall = pvW - pvC - V;
    if(shortfall>0){ const firstW = years.findIndex(x=>x.w>0); const n = firstW>0? firstW : years.length; extra = shortfall / sum(Array.from({length:n},(_,i)=>1/disc(i+1))); }
  } else {
    const n = lastYear-Y0+1; need = num(g.target.amt)*Math.pow(1+infl, n);
    funded = need>0 ? bal/need*100 : 999;
    if(bal<need){ const fvA = sum(Array.from({length:n},(_,i)=>Math.pow(1+r, n-1-i))); extra = (need-bal)/fvA; }
  }
  return { r:r*100, years, runsOut, funded, need, extra, lastYear, end:bal };
}

/* ================= Money flows over time ================= */
function windowStats(){
  // last 12 months (or since the app started, if newer), scaled to a full year
  const cut = new Date(); cut.setDate(cut.getDate()-365);
  const created = parseD(S.settings.created||today());
  const start = created>cut ? created : cut; const s = iso(start);
  const days = Math.max(1, daysBetween(s, today())+1);
  const scale = 365/days;
  const goalBuckets = new Set(S.buckets.filter(b=>b.goal&&b.goal.kind).map(b=>b.id));
  const exp = S.expenses.filter(e=>e.date>=s);
  const living = sum(exp.filter(e=>{ const h=hld(e.hid); return !(h && goalBuckets.has(h.bucketId)); }).map(e=>e.amt));
  const goalSpend = sum(exp.map(e=>e.amt)) - living;
  const inc = S.income.filter(i=>i.date>=s);
  const earned = sum(inc.filter(i=>i.src!==RETURN_SOURCE).map(i=>i.amt));
  const invInc = sum(inc.filter(i=>i.src===RETURN_SOURCE).map(i=>i.amt));
  return { days, scale, livingYr: living*scale, goalSpendYr: goalSpend*scale, earnedYr: earned*scale, invIncYr: invInc*scale, short: days<60 };
}
function sustainability(){
  const perm = S.buckets.filter(b=>b.permanent);
  const P = sum(perm.map(b=>bucketValue(b.id)));
  const nom = P>0 ? sum(perm.map(b=>bucketValue(b.id)*bucketExpected(b).net))/P : 0;
  const real = nom - S.settings.inflation;
  const D = P*Math.max(0,real)/100;
  const w = windowStats();
  const gap = w.livingYr - w.earnedYr - D;
  const needCapital = real>0 ? Math.max(0, w.livingYr - w.earnedYr)/(real/100) : Infinity;
  const fiNeed = real>0 ? w.livingYr/(real/100) : Infinity;
  let state = 'good';
  if(!perm.length || (!S.expenses.length)) state='none'; else if(gap>0) state = gap > w.livingYr*0.1 ? 'crit' : 'warn';
  return { perm, P, nom, real, D, w, gap, needCapital, fiNeed, fi: isFinite(fiNeed)&&fiNeed>0 ? P/fiNeed*100 : 0, state };
}

/* ================= Budget ================= */
function budgetStatus(year){
  const budget = num(S.settings.budgets[year]||0);
  const exp = S.expenses.filter(e=>e.date.startsWith(String(year)));
  const spent = sum(exp.map(e=>e.amt));
  const now = new Date(); const start = new Date(year,0,1), end = new Date(year+1,0,1);
  let frac = (Math.min(now,end)-start)/(end-start); frac = Math.max(0,Math.min(1,frac));
  const expected = budget*frac;
  const projected = frac>0.02 ? spent/frac : spent;
  const remaining = budget - spent;
  const monthsLeft = year===now.getFullYear() ? 12 - now.getMonth() : (year>now.getFullYear()?12:0);
  const ym = iso(now).slice(0,7);
  const thisMonth = sum(exp.filter(e=>e.date.startsWith(ym)).map(e=>e.amt));
  let state = 'good';
  if(budget>0){ if(spent>budget) state='crit'; else if(projected>budget*1.05) state='serious'; else if(spent>expected) state='warn'; }
  const inc = S.income.filter(i=>i.date.startsWith(String(year)));
  const earned = sum(inc.filter(i=>i.src!==RETURN_SOURCE).map(i=>i.amt)), invInc = sum(inc.filter(i=>i.src===RETURN_SOURCE).map(i=>i.amt));
  return { budget, spent, expected, projected, remaining, monthsLeft, perMonth: monthsLeft>0? remaining/monthsLeft : 0, thisMonth, frac, state, exp, inc, earned, invInc };
}

/* ================= Alerts ================= */
const LVL = { good:['var(--good)','✓'], warn:['var(--warn)','!'], serious:['var(--serious)','!'], crit:['var(--crit)','!'], none:['var(--surface-2)','?'] };
function alerts(){
  const out = [];
  const su = sustainability();
  if(su.state==='crit'||su.state==='warn') out.push({lvl:su.state==='crit'?'crit':'serious', text:`<b>Spending is eating into capital</b> by about ${B(su.gap)} a year.`, go:()=>go({tab:'plan'})});
  S.buckets.forEach(b=>{
    const a = analyse(b);
    if(a.needs) out.push({lvl: a.reasons.some(r=>r.lvl==='serious')?'serious':'warn', text:`<b>${esc(b.name)}</b> needs rebalancing <span class="faint">(${a.reasons.map(r=>r.text.startsWith('Off')?'off target':r.text.startsWith('Sched')?'review due':'big market move').join(', ')})</span>`, go:()=>go({tab:'buckets',bucket:b.id})});
    if(a.tsum!==100 && holdingsOf(b.id).length) out.push({lvl:'warn', text:`<b>${esc(b.name)}</b>: target mix adds up to ${a.tsum}%, not 100%.`, go:()=>editBucket(b.id)});
    const gp = goalProjection(b);
    if(gp && gp.funded<85) out.push({lvl:gp.funded<60?'serious':'warn', text:`<b>${esc(b.name)}</b> goal is ${Math.round(gp.funded)}% funded. Saving about ${B(gp.extra)} more a year would close the gap.`, go:()=>go({tab:'buckets',bucket:b.id})});
  });
  const bs = budgetStatus(nowYear());
  if(bs.budget>0 && bs.state!=='good'){
    const msg = bs.state==='crit' ? `Over your ${nowYear()} budget by ${B(-bs.remaining)}.` :
      bs.state==='serious' ? `On pace to spend ${B(bs.projected)} this year — ${B(bs.projected-bs.budget)} over budget.` :
      `Spending is a little ahead of pace (${B(bs.spent)} vs ${B(bs.expected)} expected by today).`;
    out.push({lvl:bs.state, text:msg, go:()=>go({tab:'money'})});
  }
  const stale = S.holdings.filter(h=>h.type!=='cash' && daysBetween(h.updated||today(), today())>35);
  if(stale.length) out.push({lvl:'warn', text:`${stale.length} holding value${stale.length>1?'s are':' is'} over a month old. Do your monthly check-in.`, go:()=>bulkUpdate()});
  S.policies.forEach(p=>{ if(p.renewal){ const d=daysBetween(today(), p.renewal); if(d>=0 && d<=30) out.push({lvl:'warn', text:`Insurance <b>${esc(p.name)}</b> renews in ${d} day${d===1?'':'s'} (${fmtDate(p.renewal)}).`, go:()=>go({tab:'more',sub:'insurance'})}); } });
  const lb = DEV.lastBackup; const hasData = S.holdings.length||S.expenses.length;
  const cloud = DEV.mode==='cloud';
  if(hasData && (!lb || daysBetween(lb, today()) > (cloud?30:14))) out.push({lvl:'warn', text:`Back up your data — ${lb?'last backup '+fmtDate(lb):'no backup yet'}. ${cloud?'A backup file protects you if the passphrase is ever lost.':'It lives only on this phone.'}`, go:()=>exportData()});
  return out;
}
function alertHTML(a,i){ const [c,ic]=LVL[a.lvl]; return `<div class="alert" data-alert="${i}"><span class="ic" style="background:${c}">${ic}</span><div class="grow" style="flex:1">${a.text}</div><span class="chev">›</span></div>`; }

/* ================= Charts ================= */
function lineChart(el, series, opts={}){
  const W = Math.max(280, el.clientWidth||320), H = opts.h||190, pl=8, pr=52, pt=10, pb=22;
  const all = series.flatMap(s=>s.pts);
  if(series[0].pts.length<2){ el.innerHTML = `<div class="faint empty">${opts.empty||'The chart fills in as you use the app — one point per day.'}</div>`; return; }
  const xs = series[0].pts.map(p=>parseD(p[0]).getTime());
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const vals = all.map(p=>p[1]);
  let y0=Math.min(...vals), y1=Math.max(...vals);
  const padY=(y1-y0)*0.1||Math.abs(y1)*0.05||1; y0-=padY; y1+=padY; if(y0<0 && Math.min(...vals)>=0) y0=0;
  const X = t => pl + (x1===x0?0:(t-x0)/(x1-x0))*(W-pl-pr);
  const Y = v => pt + (1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ticks = niceTicks(y0,y1,4);
  const fmtX = t => opts.yearly ? String(new Date(t).getFullYear()) : new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
  const g = ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0&&y0<0?'var(--text-3)':'var(--line)'}" stroke-width="1"/><text x="${W-pr+6}" y="${Y(v)+4}" font-size="11" fill="var(--text-3)">${short(v)}</text>`).join('');
  const dl = [x0,(x0+x1)/2,x1].map((t,i)=>`<text x="${X(t)}" y="${H-5}" font-size="11" fill="var(--text-3)" text-anchor="${['start','middle','end'][i]}">${fmtX(t)}</text>`).join('');
  const paths = series.map(s=>`<path d="${s.pts.map((p,i)=>(i?'L':'M')+X(parseD(p[0]).getTime()).toFixed(1)+','+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  el.innerHTML = `<div class="chart-wrap"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Value over time')}">${g}${dl}${paths}<line class="xh" y1="${pt}" y2="${H-pb}" stroke="var(--text-3)" stroke-width="1" style="display:none"/>${series.map((s,i)=>`<circle class="hd${i}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="display:none"/>`).join('')}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`
    + (series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'');
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W/r.width);
    let bi=0, bd=1e18; xs.forEach((t,i)=>{ const d=Math.abs(X(t)-px); if(d<bd){bd=d;bi=i;} });
    const cx = X(xs[bi]); xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.style.display='';
    series.forEach((s,i)=>{ const c=svg.querySelector('.hd'+i); const p=s.pts[bi]; if(p){c.setAttribute('cx',cx);c.setAttribute('cy',Y(p[1]));c.style.display='';} });
    tip.innerHTML = `<div class="faint">${opts.yearly? 'End of '+series[0].pts[bi][0].slice(0,4) : fmtDate(series[0].pts[bi][0])}</div>`+series.map(s=>`<div><span class="dot" style="background:${s.color};width:8px;height:8px"></span> ${esc(s.name)} <b class="num">${B(s.pts[bi]?.[1])}</b></div>`).join('');
    tip.style.display='block';
    const left = cx*(r.width/W); tip.style.left = Math.min(Math.max(0,left-75), r.width-170)+'px'; tip.style.top='0px';
  };
  const hide = ()=>{ tip.style.display='none'; xh.style.display='none'; series.forEach((s,i)=>svg.querySelector('.hd'+i).style.display='none'); };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', hide);
}
function niceTicks(a,b,n){ const span=b-a; if(span<=0) return [a]; const step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))); const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||step0; const out=[]; for(let v=Math.ceil(a/st)*st; v<=b+1e-9; v+=st) out.push(v); return out; }
function segBar(parts){
  const tot = sum(parts.map(p=>p.v)); if(tot<=0) return `<div class="seg"><div style="flex:1;background:var(--surface-2)"></div></div>`;
  return `<div class="seg">${parts.filter(p=>p.v>0).map(p=>`<div title="${TYPE_NAME[p.k]} ${pct(p.v/tot*100)}" style="flex:${p.v};background:${tColor(p.k)}"></div>`).join('')}</div>`;
}
function progressBar(p, color, h=10){ return `<div class="bar" style="height:${h}px"><div style="width:${Math.max(0,Math.min(100,p))}%;background:${color}"></div></div>`; }
function seriesFor(bid, range){
  let snaps = S.snaps.slice();
  if(range!=='All'){ const days={'1M':31,'3M':92,'1Y':366,'3Y':1096}[range]; const cut=new Date(); cut.setDate(cut.getDate()-days); const c=iso(cut); snaps=snaps.filter(s=>s.d>=c); }
  const v = snaps.map(s=>[s.d, bid==='all'? s.t : (s.b?.[bid]??0)]);
  const f = snaps.map(s=>[s.d, bid==='all'? (s.f ?? s.c ?? 0) : (s.fb?.[bid] ?? s.bc?.[bid] ?? 0)]);
  return [{name:'Value', color:'var(--accent)', pts:v},{name:'Money put in', color:'var(--cost)', dash:true, pts:f}];
}

function renderTabs(){
  const t = [['home','Home'],['buckets','Buckets'],['money','Money'],['plan','Plan'],['more','More']];
  document.getElementById('tabs').innerHTML = t.map(([k,n])=>`<button class="${UI.tab===k?'on':''}" data-tab="${k}">${ICONS[k]}${n}</button>`).join('');
}
function render(){
  renderTabs();
  const app = document.getElementById('app');
  const fab = document.getElementById('fab'); fab.style.display = (UI.sub==='handover'||UI.sub==='guide'||UI.sub==='sync') ? 'none' : '';
  if(UI.tab==='home') app.innerHTML = viewHome();
  else if(UI.tab==='buckets') app.innerHTML = UI.bucket ? viewBucket(UI.bucket) : viewBuckets();
  else if(UI.tab==='money') app.innerHTML = viewMoney();
  else if(UI.tab==='plan') app.innerHTML = viewPlan();
  else app.innerHTML = UI.sub==='guide' ? viewGuide() : UI.sub==='sync' ? viewSync() : UI.sub==='insurance' ? viewInsurance() : UI.sub==='handover' ? viewHandover() : UI.sub==='accounts' ? viewAccounts() : viewMore();
  bindView();
  if(!UI.keepScroll) window.scrollTo(0,0); UI.keepScroll=false;
}
const rangeChips = () => `<div class="chips" style="margin-top:6px">${['1M','3M','1Y','3Y','All'].map(r=>`<button class="chip ${UI.range===r?'on':''}" data-range="${r}">${r}</button>`).join('')}</div>`;
const backBtn = (label, state) => `<button class="ghost no-print" data-back='${JSON.stringify(state)}' style="margin-left:-8px">‹ ${label}</button>`;

function viewHome(){
  if(!S.accounts.length && !S.buckets.length && !(DEV.mode==='cloud' && Sync.state!=='on')) return viewWelcome();
  const tv = totalValue(), put = flowOf('all'), gain = tv-put;
  const m30 = (()=>{ const c=new Date(); c.setDate(c.getDate()-30); const ci=iso(c); return [...S.snaps].reverse().find(x=>x.d<=ci); })();
  const al = alerts(); UI._alerts = al;
  const su = sustainability(), bs = budgetStatus(nowYear());
  const goals = S.buckets.map(b=>goalProjection(b)).filter(Boolean);
  const avgFund = goals.length ? Math.min(...goals.map(g=>g.funded)) : null;
  const tile = (go, lbl, v, state, s) => `<div class="tile" data-go="${go}"><div class="lbl">${lbl}</div><div class="v">${v}</div><div class="s"><span class="dot" style="background:${LVL[state][0]};width:8px;height:8px"></span>${s}</div></div>`;
  return `
  <div class="row between"><h1>My Wealth</h1><div class="row" style="gap:8px">${syncPill()}<button class="helpbtn" data-act="openGuide" aria-label="How to use this app" title="How to use this app">?</button></div></div>
  <div class="card">
    <div class="faint">Total wealth</div>
    <div class="hero">${B(tv)}</div>
    <div class="row wrap" style="gap:4px 14px;margin-top:4px">
      <span class="faint">Growth on money put in: <b class="num ${gain>=0?'pos':'neg'}">${sgn(gain)}${B(gain)}</b></span>
      ${m30?`<span class="faint">Last 30 days: <b class="num ${tv-m30.t>=0?'pos':'neg'}">${sgn(tv-m30.t)}${B(tv-m30.t)}</b></span>`:''}
    </div>
  </div>
  <div class="tiles">
    ${tile('plan','Lifestyle', su.state==='none'?'Not set up':su.gap<=0?'Sustainable':'Gap', su.state, su.state==='none'?'Tap to set up':su.gap<=0?`${short(-su.gap)}/yr spare`:`${short(su.gap)}/yr short`)}
    ${tile('money','Budget '+nowYear(), bs.budget?B(bs.spent):'Not set', bs.budget?bs.state:'none', bs.budget?({good:'On track',warn:'Ahead of pace',serious:'Overspend pace',crit:'Over budget'}[bs.state]):'Tap to set')}
    ${tile('plan','Goals', avgFund===null?'None yet':Math.round(avgFund)+'% funded', avgFund===null?'none':avgFund>=100?'good':avgFund>=85?'warn':'serious', avgFund===null?'Add in a bucket':'lowest goal')}
  </div>
  ${al.length?`<div class="card"><h2>To do (${al.length})</h2>${al.map(alertHTML).join('')}</div>`:`<div class="card row"><span class="ic" style="background:var(--good)">✓</span><span>All good. Nothing needs your attention.</span></div>`}
  <div class="card">
    <h2>Wealth over time</h2>
    <div class="chips" style="margin:4px 0 6px">${[['all','All'],...S.buckets.map(b=>[b.id,b.name])].map(([k,n])=>`<button class="chip ${UI.chartBucket===k?'on':''}" data-cb="${k}">${esc(n)}</button>`).join('')}</div>
    <div id="homeChart"></div>${rangeChips()}
  </div>
  <div class="card">
    <div class="row between"><h2 style="margin:0">Buckets</h2><button class="ghost" data-go="buckets">See all ›</button></div>
    ${S.buckets.map(b=>bucketRow(b,tv)).join('') || '<div class="faint">No buckets yet.</div>'}
  </div>`;
}
function bucketRow(b,tv){
  const v = bucketValue(b.id), a = analyse(b), bt = byType(b.id), gp = goalProjection(b);
  return `<div class="list-item" data-bucket="${b.id}">
    <div class="grow"><div class="row between"><span class="title">${esc(b.name)}${b.permanent?' <span class="faint" title="Permanent capital">♾</span>':''}</span><span class="num"><b>${B(v)}</b></span></div>
    <div style="margin:6px 0 4px">${segBar(TYPES.map(t=>({k:t.k,v:bt[t.k]})))}</div>
    <div class="row between faint"><span>${tv?pct(v/tv*100,0):'0%'} of total${gp?` · goal ${Math.round(gp.funded)}% funded`:''}</span>${a.needs?'<span class="badge" style="background:var(--serious);color:#111">Rebalance</span>':''}</div></div><span class="chev">›</span></div>`;
}

  <div class="card"><p>This app keeps your wealth and spending <b>on this phone only</b>. Nothing is sent anywhere.</p>

  <li><b>Buckets</b> — what money is for (Emergency, Education, Growth…) and its target mix.</li>

  </div>

  ${DEV.mode==='cloud'?'':`<div class="card"><h2>Just looking?</h2><p class="muted">Load example data to see how everything works. Wipe it later in More → Clear all data.</p><button class="block" data-act="demo">Load example data</button></div>`}`;

function viewBuckets(){
  const tv = totalValue();
  return `<h1>Buckets</h1>
  <p class="help">A bucket is money with one purpose. Tap one to see its mix, goal and holdings.</p>
  <div class="card">${S.buckets.map(b=>bucketRow(b,tv)).join('') || '<div class="faint">No buckets yet.</div>'}
  <div class="actions" style="margin-top:10px"><button class="primary" data-act="addBucket">+ New bucket</button></div></div>
  <div class="legend card">${TYPES.map(t=>`<span><i style="background:${tColor(t.k)}"></i>${t.n}</span>`).join('')}<span>♾ = permanent capital</span></div>`;
}

function viewBucket(id){
  const b = bkt(id); if(!b){ UI.bucket=null; return viewBuckets(); }
  const a = analyse(b), hs = holdingsOf(id).sort((x,y)=>y.value-x.value);
  const put = flowOf(id), gain = a.val-put;
  const plan = rebalancePlan(b), ex = bucketExpected(b), perf = performance(id);
  return `<div class="row between">${backBtn('Buckets',{tab:'buckets'})}<button class="ghost" data-act="editBucket" data-id="${id}">Edit bucket</button></div>
  <h1 style="margin-top:0">${esc(b.name)}${b.permanent?' <span class="faint">♾ permanent</span>':''}</h1>
  <div class="card"><div class="faint">${esc(b.purpose||'Bucket value')}</div><div class="hero">${B(a.val)}</div>
    <div class="faint">Growth on money put in: <b class="num ${gain>=0?'pos':'neg'}">${sgn(gain)}${B(gain)}</b>${perf&&!perf.tooShort?` · return ${sgn(perf.annual)}${pct(perf.annual)}/yr`:''}</div>
    <div id="bucketChart" style="margin-top:10px"></div>${rangeChips()}
  </div>
  ${goalCard(b)}
  <div class="card"><h2>Mix vs target</h2>
    ${a.tsum!==100?`<div class="rec">Target mix adds up to ${a.tsum}%. <button class="ghost" data-act="editBucket" data-id="${id}">Set target mix</button></div>`:''}
    <div class="faint" style="margin-bottom:4px">Now</div>${segBar(a.rows.map(r=>({k:r.k,v:r.value})))}
    <div class="faint" style="margin:8px 0 4px">Target</div>${segBar(a.rows.map(r=>({k:r.k,v:r.tgt})))}
    <div class="legend">${a.rows.map(r=>`<span><i style="background:${tColor(r.k)}"></i>${TYPE_NAME[r.k]}</span>`).join('')}</div>
    <table style="margin-top:10px"><tr><th>Type</th><th>Value</th><th>Now</th><th>Target</th><th>Off by</th></tr>
    ${a.rows.map(r=>{ const off=Math.abs(r.drift)>(b.threshold??5) && a.tsum===100; return `<tr><td><span class="dot" style="background:${tColor(r.k)};width:8px;height:8px"></span> ${TYPE_NAME[r.k]}</td><td class="num">${B(r.value)}</td><td class="num">${pct(r.cur)}</td><td class="num">${r.tgt}%</td><td class="num" style="${off?'font-weight:700':''}">${off?'⚠ ':''}${sgn(r.drift)}${r.drift.toFixed(1)}</td></tr>`; }).join('')}
    </table>
    <p class="faint">Expected return of this mix: ${pct(ex.gross)}/yr, minus fees ${pct(ex.fee,2)} = <b>${pct(ex.net)}/yr</b>.</p>
  </div>
  ${rebalanceCard(b,plan)}
  <div class="card"><div class="row between"><h2 style="margin:0">Holdings</h2><button class="small primary" data-act="addHolding" data-id="${id}">+ Add holding</button></div>
    <p class="help">Tap a holding to update its value, add or withdraw money, buy or sell.</p>
    ${hs.map(h=>{ const a2=acc(h.accountId); const g=h.value-h.cost; return `<div class="list-item" data-holding="${h.id}"><span class="dot" style="background:${tColor(h.type)}"></span><div class="grow"><div class="title">${esc(h.name)}${h.locked?' 🔒':''}</div><div class="faint">${esc(a2?a2.name:'No account')} · ${TYPE_NAME[h.type]}${h.ter?` · fee ${h.ter}%`:''} · ${fmtDate(h.updated||today())}</div></div><div style="text-align:right"><div class="num"><b>${B(h.value)}</b></div>${h.type!=='cash'?`<div class="faint num ${g>=0?'pos':'neg'}">${sgn(g)}${B(g)}</div>`:''}</div></div>`; }).join('') || '<div class="faint" style="margin-top:8px">No holdings yet. Add the cash, funds, bonds… that belong to this bucket.</div>'}
  </div>`;
}
function goalCard(b){
  const gp = goalProjection(b);
  if(!gp) return `<div class="card"><div class="row between"><h2 style="margin:0">Goal</h2><button class="small" data-act="editGoal" data-id="${b.id}">Set a goal</button></div>
    <p class="help" style="margin-bottom:0">Planned spending (e.g. school fees by year, a yearly holiday) or a target amount by a date. The app projects whether this bucket will be enough.</p></div>`;
  const g = b.goal; const ok = gp.funded>=100;
  const state = ok?'good':gp.funded>=85?'warn':'serious';
  const pts = [[nowYear()+'-01-01', bucketValue(b.id)], ...gp.years.map(y=>[y.y+'-12-31', Math.max(0,Math.round(y.end))])];
  UI._goalPts = pts;
  return `<div class="card"><div class="row between"><h2 style="margin:0">Goal</h2><button class="ghost" data-act="editGoal" data-id="${b.id}">Edit goal</button></div>
    <div class="verdict" style="background:var(--surface-2)"><span class="ic" style="background:${LVL[state][0]}">${ok?'✓':'!'}</span><div><b>${Math.round(Math.min(gp.funded,999))}% funded</b><div class="faint">${ok? 'On track at your assumed returns.' : `Save about <b>${B(gp.extra)}</b> more per year to be fully funded.`}${gp.runsOut?` Money runs out in ${gp.runsOut}.`:''}</div></div></div>
    ${progressBar(gp.funded, LVL[state][0])}
    <div class="kv" style="margin-top:10px"><span class="k">${g.kind==='withdrawals'?'Planned spending':'Target'}</span><span class="num">${g.kind==='withdrawals'? (g.rows||[]).filter(r=>num(r.amt)>0).map(r=>`${B(num(r.amt))}/yr ${r.from}${r.to&&r.to!=r.from?'–'+r.to:''}`).join('<br>') : `${B(num(g.target.amt))} by ${g.target.year}`}</span></div>
    ${num(g.contrib?.amt)>0?`<div class="kv"><span class="k">You'll add</span><span class="num">${B(num(g.contrib.amt))}/yr until ${g.contrib.until}</span></div>`:''}
    <div class="kv"><span class="k">Assumed return (after fees)</span><span class="num">${pct(gp.r)}/yr</span></div>
    <div class="kv"><span class="k">Costs rise by</span><span class="num">${pct(g.growth ?? S.settings.inflation)}/yr</span></div>
    <h3>Projected balance</h3><div id="goalChart"></div>
    <p class="faint">Amounts are in today's baht and grow with the cost increase each year. This is a projection, not a promise.</p>
  </div>`;
}
function rebalanceCard(b,plan){
  const a = plan.a; if(a.tsum!==100 || a.val<=0) return '';
  if(Object.values(b.targets||{}).filter(v=>v>0).length<=1) return '';
  const recs = [];
  plan.sells.forEach(s=>{ if(s.amt>1) recs.push(`<div class="rec">Sell <b class="num">${B(s.amt)}</b> of ${TYPE_NAME[s.k]}${s.h?` — e.g. from <b>${esc(s.h.name)}</b>`:''}</div>`); });
  plan.buys.forEach(x=>{ recs.push(`<div class="rec">Buy <b class="num">${B(x.amt)}</b> of ${TYPE_NAME[x.k]}${x.h?` — e.g. into <b>${esc(x.h.name)}</b>`:' — <i>no holding of this type yet</i>'}</div>`); });
  return `<div class="card"><h2>Rebalancing</h2>
    ${a.reasons.length? a.reasons.map(r=>`<div class="alert" style="border:0;padding:4px 0;cursor:default"><span class="ic" style="background:${LVL[r.lvl][0]}">!</span><div>${esc(r.text)}</div></div>`).join('') : `<div class="alert" style="border:0;padding:4px 0;cursor:default"><span class="ic" style="background:var(--good)">✓</span><div>Within limits. Next review: ${a.due.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}.</div></div>`}
    <h3>${a.needs?'Recommended moves':'To be exactly on target you would'}</h3>
    ${recs.join('') || '<div class="faint">Already on target.</div>'}
    ${plan.lockedNote.map(n=>`<div class="faint">🔒 ${esc(n)}</div>`).join('')}
    <h3>Rebalance with new money instead</h3>
    <div class="faint">Avoids selling (and the fees and tax that come with it). Enter an amount you're adding:</div>
    <div class="row" style="margin-top:6px"><input id="contrib" inputmode="decimal" placeholder="e.g. 50,000"><button class="small" data-act="split" data-id="${b.id}">Split it</button></div>
    <div id="splitOut"></div>
    <button class="block" style="margin-top:14px" data-act="reviewed" data-id="${b.id}">✓ Mark as reviewed today</button>
    <div class="faint" style="margin-top:4px">After you've rebalanced (or decided not to). Resets the review clock and market-move baseline.</div>
  </div>`;
}

/* ---------- Money tab (expenses + income) ---------- */
function viewMoney(){
  const y = UI.spendYear, bs = budgetStatus(y);
  const years = [...new Set([nowYear(), ...S.expenses.map(e=>+e.date.slice(0,4)), ...S.income.map(e=>+e.date.slice(0,4)), ...Object.keys(S.settings.budgets).map(Number)])].sort((a,b)=>b-a);
  const isExp = UI.moneyView==='exp';
  const saved = bs.earned - bs.spent, rate = bs.earned>0 ? saved/bs.earned*100 : null;
  const list = isExp ? bs.exp : bs.inc;
  const cats = {}; list.forEach(e=>{ const k=isExp?e.cat:e.src; cats[k]=(cats[k]||0)+e.amt; });
  const catRows = Object.entries(cats).sort((a,b)=>b[1]-a[1]); const maxC = catRows[0]?.[1]||1; const tot = sum(catRows.map(c=>c[1]));
  const byMonth = {}; [...list].sort((a,b)=>a.date<b.date?1:-1).forEach(e=>{ const m=e.date.slice(0,7); (byMonth[m]=byMonth[m]||[]).push(e); });
  return `<div class="row between"><h1>Money</h1><select id="yearSel" style="width:auto">${years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="segctl"><button class="${isExp?'on':''}" data-mv="exp">Spending</button><button class="${!isExp?'on':''}" data-mv="inc">Income</button></div>
  <button class="primary block" style="margin-bottom:12px" data-act="${isExp?'addExpense':'addIncome'}">+ Record ${isExp?'expense':'income'}</button>
  ${isExp ? budgetCard(y,bs) : ''}
  <div class="card"><h2>Saving in ${y}</h2>
    <p class="help">Earned income (not counting dividends & interest) minus everything you spent.</p>
    <div class="grid2"><div><div class="faint">Earned</div><b class="num">${B(bs.earned)}</b></div><div><div class="faint">Spent</div><b class="num">${B(bs.spent)}</b></div>
    <div><div class="faint">Saved</div><b class="num ${saved>=0?'pos':'neg'}">${B(saved)}</b></div><div><div class="faint">Savings rate</div><b class="num">${rate===null?'—':pct(rate,0)}</b></div></div>
    ${bs.invInc?`<div class="faint" style="margin-top:8px">Plus ${B(bs.invInc)} dividends & interest (counted as investment return).</div>`:''}
  </div>
  <div class="card"><h2>${isExp?'Spending':'Income'} by ${isExp?'category':'source'} · ${y}</h2>
    ${catRows.map(([c,v])=>`<div style="margin:10px 0"><div class="row between"><span>${esc(c)}</span><span class="num">${B(v)} <span class="faint">${pct(v/tot*100,0)}</span></span></div><div style="margin-top:4px">${progressBar(v/maxC*100,'var(--accent)',8)}</div></div>`).join('') || `<div class="faint">Nothing recorded in ${y} yet.</div>`}
  </div>
  <div class="card"><h2>History</h2><p class="help">Tap a month to open it. Tap an entry to delete it.</p>
    ${Object.entries(byMonth).map(([m,l],mi)=>{ const open = UI.openMonth ? UI.openMonth===m : mi===0; return `<h3 class="row between" data-month="${m}" data-open="${open?1:0}" style="cursor:pointer"><span>${open?'▾':'▸'} ${parseD(m+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'})} <span class="faint">(${l.length})</span></span><span class="num">${B(sum(l.map(e=>e.amt)))}</span></h3>
      ${!open?'':l.map(e=>{ const h=hld(e.hid); return `<div class="list-item" data-${isExp?'exp':'inc'}="${e.id}"><div class="grow"><div class="title">${esc(isExp?e.cat:e.src)}${e.note?` <span class="faint">· ${esc(e.note)}</span>`:''}</div><div class="faint">${fmtDate(e.date)} · ${esc(h?h.name:'Not a tracked account')}</div></div><b class="num ${isExp?'':'pos'}">${isExp?'':'+'}${B(e.amt)}</b></div>`; }).join('')}`; }).join('') || '<div class="faint">Nothing recorded.</div>'}
  </div>`;
}
function budgetCard(y,bs){
  if(!bs.budget) return `<div class="card"><div class="row between"><h2 style="margin:0">${y} budget</h2><button class="small" data-act="setBudget">Set budget</button></div><div class="faint" style="margin-top:6px">Spent so far: ${B(bs.spent)}. Set a yearly budget to track against it.</div></div>`;
  const p = bs.spent/bs.budget*100, pace = Math.min(100,bs.frac*100); const [c] = LVL[bs.state];
  const label = {good:'On track',warn:'Ahead of pace',serious:'On pace to overspend',crit:'Over budget'}[bs.state];
  return `<div class="card"><div class="row between"><h2 style="margin:0">${y} budget</h2>${statusPill(bs.state,label)}</div>
    <div class="row between" style="margin:10px 0 6px"><span><b class="num">${B(bs.spent)}</b> <span class="faint">of ${B(bs.budget)}</span></span><span class="faint num">${bs.remaining>=0?B(bs.remaining)+' left':B(-bs.remaining)+' over'}</span></div>
    <div class="bar"><div style="width:${Math.min(100,p)}%;background:${c}"></div><div class="pace" style="left:${pace}%"></div></div>
    <div class="faint" style="margin-top:6px">Black line = where spending should be by today (${B(bs.expected)}).</div>
    <div class="grid2" style="margin-top:10px">
      <div><div class="faint">This month</div><b class="num">${B(bs.thisMonth)}</b></div>
      <div><div class="faint">Can spend / month left</div><b class="num">${B(Math.max(0,bs.perMonth))}</b></div>
      <div><div class="faint">Projected year-end</div><b class="num">${B(bs.projected)}</b></div>
      <div style="text-align:right;align-self:end"><button class="ghost" data-act="setBudget">Change budget</button></div></div>
  </div>`;
}

/* ---------- Plan tab ---------- */
function viewPlan(){
  const su = sustainability(); const w = su.w;
  const A = S.settings.assume;
  const goalB = S.buckets.filter(b=>goalProjection(b));
  const perfRows = [...S.buckets.map(b=>({name:b.name,id:b.id})), {name:'Total',id:'all'}].map(x=>{ const p=performance(x.id); const exp = x.id==='all'? currentExpected('all') : currentExpected(x.id); return {...x,p,exp}; });
  const fees = S.holdings.filter(h=>h.ter>0).map(h=>({h, yr:h.value*h.ter/100})).sort((a,b)=>b.yr-a.yr);
  const feeYr = sum(fees.map(f=>f.yr)), feeAvg = feePct(S.holdings.filter(h=>h.type!=='cash'));
  let verdict;
  if(!su.perm.length) verdict = `<div class="verdict" style="background:var(--surface-2)"><span class="ic" style="background:var(--warn)">?</span><div><b>Mark your permanent capital</b><div class="faint">Edit the bucket(s) whose principal should never be spent (e.g. Growth) and tick "Permanent capital".</div></div></div>`;
  else if(!S.expenses.length) verdict = `<div class="verdict" style="background:var(--surface-2)"><span class="ic" style="background:var(--warn)">?</span><div><b>Record your spending</b><div class="faint">Once you've logged some expenses (ideally a month or more), this shows whether your lifestyle is sustainable.</div></div></div>`;
  else verdict = `<div class="verdict" style="background:var(--surface-2)"><span class="ic" style="background:${LVL[su.state][0]}">${su.gap<=0?'✓':'!'}</span><div><b>${su.gap<=0?'Sustainable':'Eating into capital'}</b><div class="faint">${su.gap<=0?`You could spend about <b>${B(-su.gap)}</b> more a year and still keep capital growing with inflation.`:`You're spending about <b>${B(su.gap)}</b> a year more than your income plus what your permanent capital can safely give.`}</div></div></div>`;
  return `<h1>Plan</h1>
  <div class="card"><h2>Is your lifestyle sustainable?</h2>
    <p class="help">Your rule: spending should never eat into capital. This checks your last 12 months of living costs against earned income plus what your permanent capital (♾ buckets) earns above inflation.</p>
    ${verdict}
    ${su.perm.length && S.expenses.length ? `
    <div class="kv"><span class="k">Living costs per year</span><b class="num">${B(w.livingYr)}</b></div>
    <div class="kv"><span class="k">− Earned income per year</span><b class="num">${B(w.earnedYr)}</b></div>
    <div class="kv"><span class="k">− Safe draw from permanent capital</span><b class="num">${B(su.D)}</b></div>
    <div class="kv"><span class="k">${su.gap<=0?'= Spare each year':'= Shortfall each year'}</span><b class="num ${su.gap<=0?'pos':'neg'}">${B(Math.abs(su.gap))}</b></div>
    <p class="faint">Safe draw = ${B(su.P)} permanent capital × ${pct(su.real)} (expected ${pct(su.nom)} after fees − ${pct(S.settings.inflation)} inflation).${w.goalSpendYr?` Spending paid from goal buckets (${B(w.goalSpendYr)}/yr) is left out — it's planned.`:''}${w.short?` <b>Based on only ${w.days} days of records, scaled to a year — it gets more accurate over time.</b>`:''}</p>
    <h3>Financial independence</h3>
    <p class="help" style="margin-top:0">How close your permanent capital is to covering all living costs on its own, with no earned income.</p>
    ${isFinite(su.fiNeed)?`${progressBar(su.fi, su.fi>=100?'var(--good)':'var(--accent)')}<div class="row between faint" style="margin-top:6px"><span><b class="num" style="color:var(--text)">${pct(su.fi,0)}</b> there</span><span>${B(su.P)} of ${B(su.fiNeed)}</span></div>`:'<div class="faint">Expected real return is zero or negative — raise it in Assumptions to see this.</div>'}
    `:''}
  </div>

  <div class="card"><h2>Goals</h2>
    ${goalB.map(b=>{ const gp=goalProjection(b); const st=gp.funded>=100?'good':gp.funded>=85?'warn':'serious'; return `<div class="list-item" data-bucket="${b.id}"><div class="grow"><div class="row between"><span class="title">${esc(b.name)}</span><b class="num">${Math.round(Math.min(gp.funded,999))}%</b></div><div style="margin:6px 0 4px">${progressBar(gp.funded, LVL[st][0], 8)}</div><div class="faint">${gp.funded>=100?'Fully funded at assumed returns':`Save ~${B(gp.extra)}/yr more`}${gp.runsOut?` · runs out ${gp.runsOut}`:''}</div></div><span class="chev">›</span></div>`; }).join('') || '<p class="help" style="margin:0">No goals yet. Open a bucket (e.g. Education) and tap "Set a goal".</p>'}
  </div>

  <div class="card"><h2>Performance</h2>
    <p class="help">Actual return over the last 12 months (or since you started), after removing money you added or took out — compared with what your assumptions expect.</p>
    <table><tr><th>Bucket</th><th>Actual</th><th>Expected</th><th></th></tr>
    ${perfRows.map(r=>{ const p=r.p; if(!p) return `<tr><td>${esc(r.name)}</td><td colspan="3" class="faint">No history yet</td></tr>`; if(p.tooShort) return `<tr><td>${esc(r.name)}</td><td colspan="3" class="faint">Needs a month of history</td></tr>`; const ahead = p.annual>=r.exp; return `<tr style="${r.id==='all'?'font-weight:700':''}"><td>${esc(r.name)}</td><td class="num ${p.annual>=0?'pos':'neg'}">${sgn(p.annual)}${pct(p.annual)}</td><td class="num">${pct(r.exp)}</td><td>${ahead?'▲':'▼'}</td></tr>`; }).join('')}
    </table>
    <p class="faint">Per year. ▲ ahead of plan, ▼ behind. Short periods swing a lot — judge over years, not months.</p>
  </div>

  <div class="card"><h2>Fees</h2>
    <p class="help">Yearly fund fees (TER). They're already taken out of fund prices, so you never see a bill — but they reduce your return every year.</p>
    <div class="grid2"><div><div class="faint">Fees per year</div><div class="big">${B(feeYr)}</div></div><div><div class="faint">Average on investments</div><div class="big">${pct(feeAvg,2)}</div></div></div>
    ${fees.length?`<h3>Most expensive</h3>${fees.slice(0,5).map(f=>`<div class="list-item" data-holding="${f.h.id}"><div class="grow"><div class="title">${esc(f.h.name)}</div><div class="faint">${f.h.ter}% a year on ${B(f.h.value)}</div></div><b class="num">${B(f.yr)}/yr</b></div>`).join('')}`:''}
    ${S.holdings.some(h=>h.type!=='cash'&&!h.ter)?`<p class="faint">Some investments have no fee entered. Tap a holding → Edit → "Yearly fee (TER)". Find it in the fund's fact sheet.</p>`:''}
  </div>

  <div class="card"><div class="row between"><h2 style="margin:0">Assumptions</h2><button class="small" data-act="editAssume">Edit</button></div>
    <p class="help">Conservative expected yearly returns before fees. Used for goals, the sustainability check and performance comparison.</p>
    <div class="grid2">${TYPES.map(t=>`<div class="row" style="gap:6px"><span class="dot" style="background:${tColor(t.k)}"></span><span class="faint">${t.n}</span><b class="num" style="margin-left:auto">${pct(A[t.k]??0)}</b></div>`).join('')}<div class="row" style="gap:6px"><span class="faint">Inflation</span><b class="num" style="margin-left:auto">${pct(S.settings.inflation)}</b></div></div>
  </div>`;
}

  <p><b>Back up:</b> <b>More → Back up now</b> → choose <b>Drive</b> (Google Drive) and save. Do it every week or two. The app reminds you after 14 days.</p>
  <p><b>Restore / new phone:</b> install the app on the new phone (open your link in Chrome → ⋮ → Install), then <b>More → Restore</b> and pick your latest backup file.</p>
  <p class="faint">Restoring replaces everything on that phone with the backup.</p>`},
 {i:'📱', t:'Setting up on a new phone', b:`
  <p><b>Your app's address:</b></p>
  <div class="rec" style="word-break:break-all"><b>{{URL}}</b></div>
  <button class="small" data-act="copyUrl">Copy address</button>
  <p class="faint">Save this address somewhere safe (e.g. in your notes or with the family passphrase).</p>
  <h3>1. Install the app</h3>
  <ol><li>On the new Android phone, open <b>Chrome</b> and go to the address above.</li>
   <li>Tap <b>⋮</b> (top right) → <b>Add to Home screen</b> or <b>Install and create shortcut</b> → choose <b>Install</b>.</li>
   <li>Open <b>My Wealth</b> from the home screen or app drawer.</li></ol>
  <h3>2. Get your data onto it — choose one</h3>
  <ul>
   <li><b>With family sync (recommended):</b> on the welcome screen tap <b>☁ Join family sync instead</b> (or More → Family sync → Join) → paste the <b>setup code</b> → sign in with that person's email and app password → enter the <b>family passphrase</b>. The data downloads in a few seconds.<br><span class="faint">Setup code: on any phone that already syncs, More → Family sync → Copy setup code.</span></li>
   <li><b>From a backup file:</b> More → <b>Restore</b> → pick your latest backup file (e.g. from Google Drive).</li>
  </ul>
  <p class="faint">No other phone left? You can still join: the setup code is just the Firebase settings — see "Behind the scenes" to find them again.</p>`},
 {i:'☁️', t:'Family sync — sharing with a second phone', b:`
  <p>With family sync on, you and your wife share the same data live. Either phone can add expenses, record income or update values, and the other phone sees it within seconds.</p>
  <ul>
   <li><b>Free</b> — it uses your own free Google Firebase project.</li>
   <li><b>Private</b> — only the two sign-ins you created can get in.</li>
   <li><b>Encrypted</b> — data is locked with your <b>family passphrase</b> on the phone before it's uploaded. Not even Google can read it.</li>
   <li><b>Works offline</b> — changes are kept and sync when you're back online. If you both add something at the same time, nothing is lost.</li>
  </ul>
  <p><b>Joining on a new phone:</b> install the app → <b>More → Family sync → Join</b> → paste the setup code (from the first phone: More → Family sync → Copy setup code) → sign in → enter the family passphrase.</p>
  <p>The <b>☁ Synced</b> badge at the top of Home shows the status. Tap it for details.</p>
  <p class="rec">⚠️ If both of you forget the passphrase, the cloud data can't be recovered. Keep it written down, and keep making backup files now and then.</p>`},
 {i:'🔧', t:'Behind the scenes — GitHub & Firebase', b:`
  <p>Two free services run the app. You only need these if something must be changed or fixed.</p>
  <h3>GitHub — where the app lives</h3>
  <ul><li>The app's files (<code>index.html</code>, <code>sw.js</code>, <code>manifest.json</code>, two icons) are in your GitHub repository, published with <b>GitHub Pages</b> at the address above. No money data is stored there.</li>
   <li><b>To update the app:</b> github.com → your repository → <b>Add file → Upload files</b> → drop in the new files → <b>Commit changes</b>. Wait 1–2 minutes, then fully close and reopen the app. Check the version at the bottom of More.</li></ul>
  <h3>Firebase — where synced data lives (encrypted)</h3>
  <ul><li>Go to <b>console.firebase.google.com</b> and sign in with the Google account that created it. Project: <b>{{PROJECT}}</b>.</li>
   <li><b>Sign-ins:</b> Build → Authentication → Users. Add a user, copy a <b>User UID</b>, or reset a forgotten app password (⋮ → Reset password).</li>
   <li><b>Who may access the data:</b> Build → Firestore Database → Rules. Only the User UIDs listed there can get in. If you add a person, add their UID and tap <b>Publish</b>.</li>
   <li><b>Settings for the setup code:</b> ⚙️ Project settings → General → Your apps → Config (the <code>firebaseConfig</code> block). Paste it into More → Family sync → Set up / Join.</li>
   <li><b>Cost:</b> the free "Spark" plan. Never click Upgrade / Blaze, and you can't be charged.</li></ul>
  <p class="faint">The family passphrase is never stored in Firebase. If it's forgotten by everyone, the synced data can't be decrypted — restore from a backup file instead.</p>`},
 {i:'📚', t:'Words used in the app', b:`
  <ul>
   <li><b>Target mix</b> — how you want a bucket split between cash, bonds, equity, etc.</li>
   <li><b>Off by / drift</b> — how far the actual mix is from the target, in percentage points.</li>
   <li><b>Permanent capital ♾</b> — money you never spend; you only live on what it earns.</li>
   <li><b>Money put in</b> — everything you added minus everything you took out. The gap between this and the value is real growth.</li>
   <li><b>Safe draw</b> — what permanent capital can pay out each year while still keeping up with inflation.</li>
   <li><b>TER</b> — a fund's yearly fee, taken from its price automatically.</li>
   <li><b>Locked 🔒</b> — a holding the app will never suggest selling.</li>
   <li><b>% funded</b> — how much of a goal's future cost you already have, counting expected growth.</li>
  </ul>`},
 {i:'❓', t:'Common questions', b:`
  <p><b>Why doesn't the app show live prices?</b> Your funds and banks don't offer a connection for personal apps. A monthly check-in is enough for long-term investing.</p>
  <p><b>The numbers look wrong.</b> Do a monthly check-in, then check cash balances with <b>Correct balance</b>.</p>
  <p><b>I can't see the new version after an update.</b> Close the app fully and open it again (sometimes twice).</p>
  <p><b>Can my wife use it on her phone?</b> Yes — turn on <b>Family sync</b> (see that topic) and you'll both see the same data live.</p>
  <p><b>Is this financial advice?</b> No. The app does arithmetic on your own numbers and assumptions. Projections are estimates, not promises.</p>`}
]},
th: { title:'วิธีใช้แอป', intro:'ทุกอย่างที่ต้องรู้ อธิบายแบบเข้าใจง่าย แตะหัวข้อเพื่อเปิดอ่าน', sections:[
 {i:'💡', t:'แนวคิดหลัก (อ่านก่อน)', b:`
  <p>แอปนี้ติดตามว่า <b>เงินอยู่ที่ไหน</b> <b>มีไว้เพื่ออะไร</b> และ <b>ใช้จ่ายไปเท่าไร</b> แล้วจะเตือนเมื่อมีเรื่องที่ต้องดูแล</p>
  <p>มีองค์ประกอบหลัก 3 อย่าง:</p>
  <ul>
   <li><b>บัญชี (Account)</b> — ที่ที่เงินอยู่จริง เช่น "ออมทรัพย์กสิกร", "กองทุน InnovestX", "Streaming"</li>
   <li><b>กระเป๋า (Bucket)</b> — เงินนี้มีไว้ <i>เพื่ออะไร</i> เช่น "เงินฉุกเฉิน", "การศึกษา", "เงินลงทุนระยะยาว"</li>
   <li><b>รายการเงิน (Holding)</b> — เงินแต่ละก้อนในกระเป๋า เช่น "กองทุน S&amp;P500 ฿500,000 อยู่ในบัญชีกองทุน InnovestX เป็นของกระเป๋าลงทุนระยะยาว"</li>
  </ul>
  <p>บัญชีเดียวอาจมีเงินของหลายกระเป๋า และกระเป๋าเดียวอาจใช้หลายบัญชีได้ เป็นเรื่องปกติ</p>
  <p class="rec">🔒 ข้อมูลอยู่ <b>ในโทรศัพท์ของเรา</b> ถ้าเปิด <b>Family sync</b> ข้อมูลที่เข้ารหัสแล้วจะแชร์กับโทรศัพท์ภรรยาผ่านโปรเจกต์ Firebase ของเราเอง ไม่ว่าแบบไหนก็ควรสำรองข้อมูลเป็นระยะ (ดูหัวข้อ "สำรองข้อมูล")</p>`},
 {i:'🚀', t:'เริ่มต้นใช้งาน (10 นาที)', b:`
  <ol>
   <li>ไปที่ <b>More → Accounts → + Add account</b> เพิ่มบัญชีธนาคาร บัญชีกองทุน และบัญชีหุ้นที่ใช้</li>
   <li>ไปที่ <b>Buckets → + New bucket</b> ตั้งชื่อ (เช่น เงินฉุกเฉิน) และกำหนด <b>สัดส่วนเป้าหมาย (Target mix)</b> เช่น เงินสด 20% ตราสารหนี้ 40% หุ้น 40% รวมต้องได้ 100%</li>
   <li>ติ๊ก <b>Permanent capital ♾ (เงินต้นถาวร)</b> สำหรับกระเป๋าที่ห้ามใช้เงินต้น (ปกติคือกระเป๋าลงทุนระยะยาว)</li>
   <li>เปิดกระเป๋าแล้วแตะ <b>+ Add holding</b> เพิ่มเงินแต่ละก้อน: ชื่อ ประเภท (เงินสด หุ้น ตราสารหนี้…) บัญชี และมูลค่าวันนี้</li>
   <li>ไปที่ <b>More → Yearly budget</b> ตั้งงบที่จะใช้จ่ายในปีนี้</li>
  </ol>
  <p>อยากลองดูก่อน? ที่หน้าต้อนรับ แตะ <b>Load example data</b> ลบทีหลังได้ที่ <b>More → Clear all data</b></p>`},
 {i:'🧾', t:'บันทึกรายจ่ายและรายได้', b:`
  <p>แตะปุ่มสีฟ้า <b>+ Add</b> (มุมขวาล่าง) → <b>Expense (รายจ่าย)</b> หรือ <b>Income (รายได้)</b></p>
  <ol><li>พิมพ์จำนวนเงิน</li><li>แตะหมวดหมู่ (หรือแหล่งรายได้)</li><li>เลือกว่าจ่ายจาก / รับเข้า บัญชีเงินสดไหน</li><li>แตะ <b>Save</b></li></ol>
  <p>แอปจะหักหรือเพิ่มเงินในบัญชีเงินสดนั้นให้อัตโนมัติ</p>
  <p><b>บันทึกผิด?</b> ไปที่ <b>Money → History</b> แตะรายการนั้น แล้วกด <b>Delete</b> เงินจะคืนกลับ</p>
  <p class="faint">เคล็ดลับ: รายได้ประเภท "Dividends &amp; interest (เงินปันผลและดอกเบี้ย)" นับเป็นผลตอบแทนจากการลงทุน ไม่ใช่รายได้ใหม่</p>`},
 {i:'🔄', t:'อัปเดตมูลค่ารายเดือน (5 นาที)', b:`
  <p>ราคากองทุนและหุ้นเปลี่ยนทุกวัน แต่แอปไม่รู้เองอัตโนมัติ เดือนละครั้งให้:</p>
  <ol><li>แตะ <b>+ Add → Monthly check-in</b></li><li>เปิดแอป InnovestX, Streaming และแอปธนาคาร</li><li>พิมพ์มูลค่าปัจจุบันของแต่ละรายการ</li><li>แตะ <b>Save changes</b></li></ol>
  <p>หน้า Home จะเตือนถ้ามีมูลค่าไหนเก่าเกิน 1 เดือน</p>`},
 {i:'💸', t:'ซื้อ ขาย และโอนเงิน', b:`
  <p>เปิดกระเป๋า → แตะรายการเงิน จะเห็นปุ่มเหล่านี้:</p>
  <ul>
   <li><b>Update value</b> — ราคาเปลี่ยน (ไม่มีเงินเข้าออก)</li>
   <li><b>Add money</b> — เงินใหม่จากภายนอก (เช่น จากบัญชีธุรกิจ)</li>
   <li><b>Withdraw</b> — ถอนเงินออกไปใช้</li>
   <li><b>Buy (from cash)</b> — ซื้อกองทุนนี้เพิ่มโดยใช้เงินจากบัญชีเงินสด</li>
   <li><b>Sell (to cash)</b> — ขายบางส่วนแล้วเงินเข้าบัญชีเงินสด</li>
   <li><b>Move money</b> (เฉพาะเงินสด) — โอนระหว่างสองรายการ</li>
   <li><b>Correct balance</b> (เฉพาะเงินสด) — แก้ยอดให้ตรงกับแอปธนาคาร</li>
  </ul>
  <p>ควรใช้ปุ่มให้ถูก เพราะช่วยให้แอปแยก <i>การเติบโตจากตลาด</i> ออกจาก <i>เงินที่ใส่เพิ่ม</i> ได้</p>`},
 {i:'⚖️', t:'การปรับสมดุลพอร์ต (Rebalancing)', b:`
  <p>เมื่อเวลาผ่านไป ตลาดขึ้นลง ทำให้สัดส่วนในกระเป๋าเบี้ยวจากเป้า (เช่น หุ้นจาก 40% กลายเป็น 50%) แอปจะแนะนำให้ปรับเมื่อ:</p>
  <ul><li>สินทรัพย์ประเภทใดเบี่ยงจากเป้าเกิน <b>5 จุด</b> หรือ</li><li>ครบ <b>6 เดือน</b> นับจากการทบทวนครั้งล่าสุด หรือ</li><li>เงินลงทุนขึ้นหรือลง <b>10%</b> นับจากการทบทวนครั้งล่าสุด</li></ul>
  <p>เปลี่ยนตัวเลขเหล่านี้ได้ใน <b>Edit bucket</b></p>
  <p>เปิดกระเป๋าเพื่อดูว่าต้อง <b>ขายและซื้อเท่าไร</b> รายการที่ตั้งเป็น <b>🔒 Locked</b> (เช่น RMF/SSF เงินฝากประจำ) จะไม่ถูกแนะนำให้ขาย</p>
  <p><b>มีเงินใหม่จะลงอยู่แล้ว?</b> ใช้ "Rebalance with new money instead" แอปจะบอกวิธีแบ่งเงินโดยไม่ต้องขายอะไรเลย</p>
  <p>ปรับเสร็จแล้ว (หรือตัดสินใจไม่ปรับ) ให้แตะ <b>✓ Mark as reviewed today</b></p>`},
 {i:'🎯', t:'เป้าหมาย — เงินจะพอไหม?', b:`
  <p>เปิดกระเป๋า → <b>Set a goal</b> เลือกแบบใดแบบหนึ่ง:</p>
  <ul>
   <li><b>Planned spending (ค่าใช้จ่ายตามแผน)</b> — เงินที่กระเป๋าต้องจ่ายออก เช่น ค่าเรียน ฿600,000 ต่อปี ปี 2034–2039 แล้วค่ามหาวิทยาลัย ฿3,000,000 ต่อปี ปี 2040–2043 เพิ่มได้หลายช่วง</li>
   <li><b>Target amount (ยอดเป้าหมาย)</b> — มีเงินถึงยอดที่ตั้งภายในปีที่กำหนด เช่น ฿5,000,000 ภายในปี 2035</li>
  </ul>
  <p>ใส่ได้ว่าจะเติมเงินปีละเท่าไร และค่าใช้จ่ายขึ้นปีละกี่ % (ค่าการศึกษามักขึ้น 4–5% ต่อปี) ใส่จำนวนเงินเป็น <b>ค่าเงินวันนี้</b> แอปจะคิดเงินเฟ้อให้เอง</p>
  <p>แอปจะแสดง <b>% ที่มีเงินพร้อมแล้ว</b> ต้อง <b>ออมเพิ่มปีละเท่าไร</b> ถ้ายังไม่พอ และกราฟคาดการณ์ยอดเงิน</p>`},
 {i:'📈', t:'อธิบายแท็บ Plan', b:`
  <p><b>Is your lifestyle sustainable? (ใช้ชีวิตแบบนี้ยั่งยืนไหม)</b> ตรวจตามหลักว่าห้ามใช้จ่ายจนกินเงินต้น โดยเทียบค่าใช้จ่ายในชีวิตประจำวัน 12 เดือนที่ผ่านมา กับรายได้จากการทำงาน บวกเงินที่เงินต้นถาวร (♾) จ่ายออกได้อย่างปลอดภัยโดยไม่หดตัวหลังหักเงินเฟ้อ เขียว = ดี แดง = กำลังกินเงินต้นทีละน้อย</p>
  <p><b>Financial independence (อิสรภาพทางการเงิน)</b> — เงินต้นถาวรใกล้จะเลี้ยงค่าใช้จ่ายทั้งหมดได้เองแค่ไหน</p>
  <p><b>Goals</b> — % ความพร้อมของทุกเป้าหมายในที่เดียว</p>
  <p><b>Performance (ผลตอบแทน)</b> — ผลตอบแทนจริงในปีที่ผ่านมา (ตัดเงินที่ใส่เพิ่มหรือถอนออกแล้ว) เทียบกับที่คาดไว้ ▲ ดีกว่าแผน ▼ แย่กว่าแผน ควรดูเป็นปี ไม่ใช่เป็นเดือน</p>
  <p><b>Fees (ค่าธรรมเนียม)</b> — กองทุนเก็บค่าธรรมเนียมเราปีละกี่บาท ใส่ค่า TER ของแต่ละกองทุนที่ รายการเงิน → <b>Edit details</b> หาได้ในหนังสือชี้ชวน (Fund fact sheet)</p>
  <p><b>Assumptions (สมมติฐาน)</b> — ผลตอบแทนต่อปีที่คาดไว้ของแต่ละประเภท (เงินสด 1% ตราสารหนี้ 2% หุ้น 6%…) และเงินเฟ้อ ควรตั้งแบบระมัดระวัง แก้ไขได้ที่ <b>Edit</b></p>`},
 {i:'🎯', t:'งบประมาณรายปี', b:`
  <p>ตั้งได้ที่ <b>More → Yearly budget</b> (หรือที่แท็บ Money) แล้วแท็บ Money จะแสดง:</p>
  <ul><li>ใช้ไปแล้วเท่าไร เหลือเท่าไร</li><li><b>เส้นสีดำ</b> แสดงว่าถึงวันนี้ควรใช้ไปแค่ไหน</li><li>เดือนที่เหลือใช้ได้เดือนละเท่าไร</li><li>คาดว่าทั้งปีจะใช้เท่าไร</li></ul>
  <p>สถานะเป็นสีเหลืองถ้าใช้เร็วกว่าแผน และสีแดงถ้ามีแนวโน้มเกินงบ และจะเตือนเมื่อรายจ่ายใหม่ทำให้เกินงบ</p>`},
 {i:'🏠', t:'หน้า Home และรายการ To do', b:`
  <p>3 กล่องด้านบนบอกภาพรวมในพริบตา: <b>Lifestyle</b>, <b>Budget</b> และ <b>Goals</b> เขียว = ดี เหลือง = ควรดู แดง = ต้องจัดการ แตะเพื่อดูรายละเอียด</p>
  <p>รายการ <b>To do</b> รวมทุกเรื่องที่ต้องดูแล: ปรับพอร์ต เป้าหมายที่เงินยังไม่พอ งบประมาณ มูลค่าที่เก่าแล้ว ประกันที่ใกล้ต่ออายุ และการสำรองข้อมูล แตะเพื่อไปที่เรื่องนั้นได้ทันที ถ้าขึ้นว่า "All good" แปลว่าไม่มีอะไรต้องทำ</p>`},
 {i:'🛡️', t:'ประกันและเอกสารส่งต่อให้ครอบครัว', b:`

const FB_VER = '13.4.0';
const b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c=>c.charCodeAt(0));
async function deriveKey(pass, saltB64){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:b64(iv), c:b64(new Uint8Array(c)) };
}
async function decrypt(key, d){
  const p = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(d.iv)}, key, unb64(d.c));
  return JSON.parse(new TextDecoder().decode(p));
}

function toFS(v){
  if(v===null || v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number') return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(toFS)}};
  return {mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,toFS(x)]))}};
}
function fromFS(f){
  if(!f) return null;
  if('stringValue' in f) return f.stringValue; if('booleanValue' in f) return f.booleanValue;
  if('integerValue' in f) return Number(f.integerValue); if('doubleValue' in f) return f.doubleValue;
  if('timestampValue' in f) return f.timestampValue; if('nullValue' in f) return null;
  if('arrayValue' in f) return (f.arrayValue.values||[]).map(fromFS);
  if('mapValue' in f) return Object.fromEntries(Object.entries(f.mapValue.fields||{}).map(([k,x])=>[k,fromFS(x)]));
  return null;
}

  async init(){ const F = await this.load(); if(!this.app){ this.app = F.initializeApp(DEV.cfg); this.auth = F.getAuth(this.app); } return F; },
  currentUser(){ return new Promise(res=>{ const off = this.F.onAuthStateChanged(this.auth, u=>{ try{ off(); }catch(e){} res(u); }); }); },
  async signIn(email, pw){ const F = await this.init(); const c = await F.signInWithEmailAndPassword(this.auth, email.trim(), pw); this.user = c.user; DEV.email = c.user.email; saveDev(); return c.user; },
  async api(method, path, body){
    const token = await this.user.getIdToken();
    const r = await fetch(REST()+path, { method, headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const text = await r.text(); let j = {}; try{ j = JSON.parse(text||'{}'); }catch(e){}
    if(!r.ok) throw new HttpErr(r.status, (j.error && (j.error.status+': '+j.error.message)) || text.slice(0,200));
    return j;
  },
  async vault(){
    try{ const d = await this.api('GET', '/meta/vault'); return fromFS({mapValue:{fields:d.fields||{}}}); }
    catch(e){ if(e.status===404 && !/database/i.test(e.message)) return null; throw e; }
  },
  async createVault(pass){
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const key = await deriveKey(pass, salt); const check = await encrypt(key, {ok:'mywealth'});
    await this.api('PATCH', '/meta/vault', { fields: toFS({ salt, check, created:Date.now(), v:1 }).mapValue.fields });
    this.key = key; await IDB.set('vaultKey', key);
  },
  async unlock(pass, meta){
    const key = await deriveKey(pass, meta.salt);
    try{ const o = await decrypt(key, meta.check); if(o.ok!=='mywealth') throw 0; }catch(e){ throw new Error('WRONG_PASS'); }
    this.key = key; await IDB.set('vaultKey', key);
  },
  markAll(){ KINDS.forEach(k=>S[k].forEach(r=>DIRTY.set(r.id,{kind:k,del:false}))); DIRTY.set('settings',{kind:'settings',del:false}); },
  ok(){ if(this.state!=='on'){ this.state='on'; this.err=''; scheduleRender(); } },
  fail(e){
    console.warn('sync', e);
    const offline = e instanceof TypeError || navigator.onLine===false;
    this.state = offline ? 'offline' : 'error'; this.err = offline ? 'No internet — changes are saved on this phone and will sync later.' : fbError(e,'db');
    scheduleRender();
  },
  async push(){
    if(DEV.mode!=='cloud' || !this.key || !this.user) return;
    if(this.pushing){ this.again = true; return; }
    this.pushing = true;
    try{
      do{
        this.again = false;
        const items = [...DIRTY.entries()]; if(!items.length) break;
        for(let i=0;i<items.length;i+=300){
          const chunk = items.slice(i,i+300); const writes = [];
          for(const [id,entry] of chunk){
            const rec = entry.kind==='settings' ? S.settings : S[entry.kind]?.find(x=>x.id===id);
            const payload = (entry.del || !rec) ? {k:entry.kind, del:true, at:Date.now()} : {k:entry.kind, r:stripRec(entry.kind, rec)};
            const enc = await encrypt(this.key, payload);
            writes.push({ update:{ name:`projects/${DEV.cfg.projectId}/databases/(default)/documents/items/${id}`, fields:{ iv:{stringValue:enc.iv}, c:{stringValue:enc.c}, del:{booleanValue:!!payload.del} } },
                          updateTransforms:[{ fieldPath:'ts', setToServerValue:'REQUEST_TIME' }] });
          }
          await this.api('POST', ':commit', { writes });
          chunk.forEach(([id,entry])=>{ if(DIRTY.get(id)===entry) DIRTY.delete(id); });   // keep it if it changed again meanwhile
          IDB.set('outbox', [...DIRTY.entries()].map(([id,x])=>[id,x.kind,x.del]));
        }
        this.ok();
      } while(this.again);
    }catch(e){ this.fail(e); }
    this.pushing = false;
  },
  async poll(){
    if(this.polling || DEV.mode!=='cloud' || !this.key || !this.user) return;
    this.polling = true;
    try{
      if(DIRTY.size) await this.push();
      let since = Math.max(0, (DEV.lastTsUs||0) - 10e6), maxUs = DEV.lastTsUs||0, changed = false;
      for(let page=0; page<100; page++){
        const res = await this.api('POST', ':runQuery', { structuredQuery:{ from:[{collectionId:'items'}],
          where:{ fieldFilter:{ field:{fieldPath:'ts'}, op:'GREATER_THAN', value:{ timestampValue: microsToTs(since) } } },
          orderBy:[{ field:{fieldPath:'ts'}, direction:'ASCENDING' }], limit:300 } });
        const docs = (Array.isArray(res) ? res : []).filter(x=>x.document).map(x=>x.document);
        for(const d of docs){
          const f = d.fields||{}; const us = f.ts && f.ts.timestampValue ? tsMicros(f.ts.timestampValue) : 0;
          if(us>maxUs) maxUs = us; if(us>since) since = us;
          let o; try{ o = await decrypt(this.key, {iv:f.iv?.stringValue, c:f.c?.stringValue}); }catch(e){ console.warn('could not decrypt', d.name); continue; }
          if(applyRemote(d.name.split('/').pop(), o)) changed = true;
        }
        if(docs.length < 300) break;
      }
      DEV.lastTsUs = maxUs; saveDev(); this.ok();
      if(changed){ recompute(); persistLocal(); scheduleRender(); }
    }catch(e){ this.fail(e); }
    this.polling = false;
  },
  listen(){
    this.stopPoll();
    const loop = async ()=>{ if(!document.hidden) await this.poll(); this.timer = setTimeout(loop, DIRTY.size ? 2000 : 5000); };
    loop();
  },
  stopPoll(){ clearTimeout(this.timer); this.timer = null; },
  async resume(){
    try{
      await this.init();
      const u = await this.currentUser();
      if(!u){ this.state='signedout'; scheduleRender(); return; }
      this.user = u;
      const key = await IDB.get('vaultKey');
      if(!key){ this.state='locked'; scheduleRender(); return; }
      this.key = key; this.listen(); scheduleRender();
    }catch(e){ this.fail(e); }
  },
  async stop(){
    this.stopPoll(); try{ if(this.auth) await this.F.signOut(this.auth); }catch(e){}
    this.user=null; this.key=null; this.state='off';

  }
};
function stripRec(kind, r){ if(kind!=='holdings') return r; const {value, cost, ...rest} = r; return rest; }
function applyRemote(id, o){
  const kind = o.k;
  if(kind==='settings'){ if(o.r && (!S.settings.at || (o.r.at||0) >= S.settings.at)){ S.settings = Object.assign(blank().settings, o.r); return true; } return false; }
  if(!KINDS.includes(kind)) return false;
  const arr = S[kind]; const i = arr.findIndex(x=>x.id===id);
  if(o.del){ if(i>=0 && (arr[i].at||0) <= (o.at||0)){ arr.splice(i,1); return true; } return false; }
  if(i<0){ arr.push(o.r); if(kind==='snaps') arr.sort((a,b)=>a.d<b.d?-1:1); return true; }
  if((arr[i].at||0) <= (o.r.at||0)){ arr[i] = o.r; return true; }
  return false;
}

  const bg = document.createElement('div'); bg.className='sheet-bg'; bg.id='sheet';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h2>${title}</h2><button class="x" data-close aria-label="Close">✕</button></div>${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeSheet(); });
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet());
  onMount && onMount(bg);
}
function closeSheet(){ const s=document.getElementById('sheet'); if(s) s.remove(); }
function confirmSheet(msg, okText, fn){
  sheet('Are you sure?', `<p>${esc(msg)}</p><div class="actions"><button data-close>Cancel</button><button class="danger" id="okBtn">${esc(okText)}</button></div>`, el=>{ el.querySelector('#okBtn').onclick=()=>{ closeSheet(); fn(); }; });
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const val = (el,id) => (el.querySelector('#'+id)?.value ?? '').trim();
const after = () => { save(); closeSheet(); UI.keepScroll=true; render(); };
